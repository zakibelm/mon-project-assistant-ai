# Déploiement sur le VPS : PostgreSQL + application.
# Les secrets sont dans .env (non versionné), voir .env.example.
services:
  db:
    image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    restart: unless-stopped
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Pas de port publié : la base n'est joignable que par l'application.

  app:
    build: .
    image: assistant-projet:${APP_VERSION:-local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://assistant:${POSTGRES_PASSWORD}@db:5432/assistant
    # Écoute seulement en local : nginx fait le HTTPS devant.
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
