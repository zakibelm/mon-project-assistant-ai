<title>Démo Assistant Projet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Mise en page : bandeau d'explication en haut, barre de navigation de l'outil, écran courant, visite guidée fixée en bas. */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --sunken:#E8ECEB; --line:#D5DCDA; --ink:#0F1E24; --muted:#5A6A70;
  --accent:#0B6E6C; --accent-ink:#FFFFFF; --accent-soft:#D3EAE8; --hero:#0F1E24; --hero-ink:#EAF2F1; --hero-muted:#9FB5B3;
  --st-todo:#8A979E; --st-doing:#C98A0B; --st-block:#C2413A; --st-done:#2E8B57;
  --sev3:#C2413A; --sev2:#C98A0B; --sev1:#6E8A92; --demo:#5B4BB7; --demo-soft:#ECE9FA; --spot:#E8A317;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1418; --surface:#122027; --sunken:#182A32; --line:#25383F; --ink:#E3ECEB; --muted:#93A6A9;
  --accent:#3FB5B1; --accent-ink:#04201F; --accent-soft:#163A39; --hero:#050C0F; --hero-ink:#E3ECEB; --hero-muted:#8AA3A3;
  --st-todo:#7D8B92; --st-doing:#E0A52C; --st-block:#E2675F; --st-done:#4CB27A;
  --sev3:#E2675F; --sev2:#E0A52C; --sev1:#7D9AA2; --demo:#A99CF0; --demo-soft:#25213F; --spot:#F2B63C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1418; --surface:#122027; --sunken:#182A32; --line:#25383F; --ink:#E3ECEB; --muted:#93A6A9;
  --accent:#3FB5B1; --accent-ink:#04201F; --accent-soft:#163A39; --hero:#050C0F; --hero-ink:#E3ECEB; --hero-muted:#8AA3A3;
  --st-todo:#7D8B92; --st-doing:#E0A52C; --st-block:#E2675F; --st-done:#4CB27A;
  --sev3:#E2675F; --sev2:#E0A52C; --sev1:#7D9AA2; --demo:#A99CF0; --demo-soft:#25213F; --spot:#F2B63C; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.55 var(--f-body);padding-bottom:calc(180px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted);font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto}

/* bandeau d'explication de la démo */
.demo-band{background:var(--demo-soft);color:var(--ink);border-bottom:1px solid var(--line);font-size:13px}
.demo-band .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-block:8px}
.demo-band b{color:var(--demo)}
.demo-band .sp{flex:1}
.linkbtn{border:0;background:transparent;color:var(--demo);font-weight:600;padding:2px 4px;text-decoration:underline}

/* barre de l'outil */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand small{font-family:var(--f-mono);font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-left:6px}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{border:0;background:transparent;padding:6px 12px;border-radius:999px;color:var(--muted);font-weight:500}
.nav button[aria-current="page"]{background:var(--ink);color:var(--surface)}
.nav .new{color:var(--accent);font-weight:600}
.nav .new[aria-current="page"]{color:var(--surface)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
.ex{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--demo);border:1px solid var(--demo);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}
.nav button[aria-current="page"] .ex{color:var(--surface);border-color:var(--surface)}

main{padding-bottom:40px}

/* accueil */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:0 0 18px 18px;padding:32px 28px 26px;border:1px solid var(--line);border-top:0}
.hero .date{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--hero-muted)}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,5vw,44px);line-height:1.05;letter-spacing:-.02em;margin:8px 0 6px;text-wrap:balance}
.hero .headline{font-size:clamp(16px,2.2vw,20px);margin:0;max-width:62ch}
.ask{margin-top:20px;display:flex;gap:8px;background:var(--surface);border-radius:14px;padding:6px;box-shadow:0 10px 30px rgb(0 0 0 / .25);max-width:820px;flex-wrap:wrap}
.ask input{flex:1;min-width:180px;border:0;background:transparent;padding:11px;font-size:16px;color:var(--ink)}
.ask input:focus{outline:none}
.ask select{border:0;background:var(--sunken);border-radius:10px;padding:0 10px;color:var(--ink);max-width:230px;min-height:42px}
.go{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 18px;font-weight:600}
.go:disabled{opacity:.5;cursor:default}
.hero .ghostlink{display:inline-block;margin-top:14px;border:0;background:transparent;color:var(--hero-muted);padding:0}
.hero .ghostlink:hover{color:var(--hero-ink)}
.pulse{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin-top:22px}
.pcard{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.pcard:hover{border-color:var(--accent)}
.pcard .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pcard .name{font-family:var(--f-display);font-weight:700;font-size:17px}
.chip{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip.ok{background:color-mix(in srgb,var(--st-done) 18%,transparent);color:var(--st-done)}
.chip.watch{background:color-mix(in srgb,var(--st-doing) 20%,transparent);color:var(--st-doing)}
.chip.late{background:color-mix(in srgb,var(--st-block) 18%,transparent);color:var(--st-block)}
.track{position:relative;height:8px;border-radius:999px;background:var(--sunken)}
.track .fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--accent)}
.track .expect{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.pcard .legend{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 12px;flex-wrap:wrap}
.section-h h2{font-family:var(--f-display);font-size:22px;margin:0;letter-spacing:-.01em}
.cards{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:6px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card .stripe{background:var(--sev1)}
.card[data-sev="3"] .stripe{background:var(--sev3)} .card[data-sev="2"] .stripe{background:var(--sev2)}
.card .body{padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center}
@media (max-width:760px){.card .body{grid-template-columns:minmax(0,1fr)}}
.card .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.card .kind{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;font-size:11px;font-weight:500}
.card[data-sev="3"] .kind{color:var(--sev3)} .card[data-sev="2"] .kind{color:var(--sev2)}
.card h3{margin:2px 0 0;font-size:16px;font-weight:600}
.card p{margin:2px 0 0;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.card .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;color:var(--muted);background:transparent}
.btn:disabled{opacity:.55;cursor:default}
.card .resolve,.card .ai-link{grid-column:1/-1}
.resolve{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;background:var(--sunken);border-radius:8px;padding:10px 12px}
.resolve label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.resolve input[type="date"]{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);color:var(--ink)}
.resolve.list{flex-direction:column;align-items:stretch;gap:6px}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rname{min-width:0;flex:1 1 240px;font-size:14px}
.rrow select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);color:var(--ink);font-size:14px;min-width:150px}
.ai-link{justify-self:start;border:0;background:transparent;color:var(--accent);font-size:13px;padding:0;text-decoration:underline;text-underline-offset:2px}
.card.resolved{opacity:.9}
.card.resolved .stripe{background:var(--st-done)}
.card.resolved .kind{color:var(--st-done)}
.done-line{margin:2px 0 0;font-size:14px;color:var(--ink) !important}
.asuser{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.asuser select{border:1px solid var(--line);border-radius:6px;padding:2px 6px;background:var(--surface);color:var(--ink);font-size:13px}
table.wide{min-width:820px}
.tscroll td:first-child{min-width:200px}
.tmeta{display:block;font-size:12px;color:var(--muted);margin-top:2px}
td.c-note{max-width:220px}
.note-btn{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 6px;margin:-2px -6px;text-align:left;color:var(--ink);max-width:100%}
.note-btn:hover{border-color:var(--line);background:var(--bg)}
.note-btn .excerpt{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note-btn.due{color:var(--st-block);font-weight:600;font-size:13px}
.note-btn.add{color:var(--muted);font-size:13px}
.ptype{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.stars{display:inline-flex;gap:1px;white-space:nowrap}
.stars button{border:0;background:transparent;padding:0 1px;font-size:17px;line-height:1;color:var(--line)}
.stars span{font-size:15px;color:var(--line)}
.stars .on{color:var(--st-doing)}
.rating-cell{display:inline-flex;flex-direction:column;gap:2px}
.pending{font-size:11px;color:var(--st-doing);font-weight:500}
.validate-box{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;color:var(--muted)}
.validate-box.on{color:var(--st-done);font-weight:600}
.validate-box input{width:16px;height:16px;accent-color:var(--st-done)}
.validate-box input:disabled{cursor:not-allowed}
.note-panel{margin-top:8px;background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.note-panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.note-grid{display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:900px){.note-grid{grid-template-columns:minmax(0,1fr)}}
.note-grid label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.note-grid select,.note-grid textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--surface);color:var(--ink);font-size:14px;resize:vertical}
.note-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.validate{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.validate .muted{flex:1 1 300px}
.lessons-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:22px}
.ltitle{font-family:var(--f-display);font-size:clamp(24px,4vw,32px);margin:0 0 4px;letter-spacing:-.015em}
.lessons-head p{margin:0;max-width:70ch}
.lessons-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;margin-top:16px;align-items:start}
@media (max-width:980px){.lessons-grid{grid-template-columns:minmax(0,1fr)}}
.stat{margin-bottom:10px}
.stat-row{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:4px;flex-wrap:wrap}
.vnotes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.vnotes li,.lesson{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.vnotes p,.lesson p{margin:4px 0 0}
.vtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.lesson{margin-bottom:10px}
.lesson h3{margin:2px 0 4px;font-size:16px}
.lesson .reco{background:var(--accent-soft);border-radius:6px;padding:6px 8px}
@media (min-width:981px){.layout{grid-template-columns:minmax(0,1fr) 340px}}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted)}

/* vue projet */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;margin-top:8px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}
.phead h1{font-family:var(--f-display);font-size:clamp(24px,4vw,30px);letter-spacing:-.015em;margin:20px 0 4px;text-wrap:balance}
.phead p{margin:0 0 10px;color:var(--muted);max-width:75ch}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tag{font-size:12px;background:var(--sunken);border-radius:999px;padding:3px 10px}
.group{margin-top:18px}
.group h3{font-size:15px;margin:0 0 6px}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--sunken);font-weight:500}
tr:last-child td{border-bottom:0}
tr.flash td{animation:flash 1.6s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--spot) 35%,transparent)}to{background:transparent}}
.pill{display:inline-block;border:0;color:#fff;border-radius:5px;padding:2px 9px;font-size:12px;font-weight:500}
.slip{color:var(--st-doing);font-size:12px;white-space:nowrap}
select.owner{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;margin:-4px -6px;color:var(--ink);font-size:14px;max-width:100%}
select.owner:hover,select.owner:focus{border-color:var(--line);background:var(--bg)}
select.owner[data-empty="true"]{color:var(--st-block)}
.lastc{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.notifs{margin-top:12px;font-size:13px;color:var(--muted)}

.chat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;position:sticky;top:120px;max-height:calc(100vh - 330px);min-height:420px}
@media (max-width:980px){.chat{position:static;max-height:none}}
.chat .head{padding:12px 14px;border-bottom:1px solid var(--line)}
.chat .head strong{font-family:var(--f-display);font-size:17px}
.log{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:200px}
.msg{padding:9px 12px;border-radius:10px;white-space:pre-wrap;max-width:94%;font-size:14px}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.assistant{align-self:flex-start;background:var(--sunken)}
.msg .did{margin-top:6px;font-size:12px;color:var(--st-done);font-weight:500}
.msg .opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;white-space:normal}
.sugg{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.sugg button{font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;color:var(--muted)}
.chat form{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.chat form input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--bg)}

/* nouveau projet */
.intake-box{margin-top:20px;background:var(--surface);border-radius:14px;padding:8px;box-shadow:0 10px 30px rgb(0 0 0 / .25);max-width:880px}
.intake-box textarea{width:100%;border:0;background:transparent;color:var(--ink);font-size:15px;line-height:1.55;padding:12px;resize:vertical;min-height:190px}
.intake-box textarea:focus{outline:none}
.intake-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:4px}
.loading{margin-top:20px;max-width:880px;display:flex;flex-direction:column;gap:8px}
.loading div{font-family:var(--f-mono);font-size:13px;color:var(--hero-muted)}
.loading div.on{color:var(--hero-ink)}
.review-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:22px}
.review-head > div:first-child{flex:1 1 420px;min-width:0}
.title-input{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,4vw,32px);letter-spacing:-.015em;border:0;border-bottom:2px dashed var(--line);background:transparent;padding:2px 0;width:100%;color:var(--ink)}
.title-input:focus{outline:none;border-bottom-color:var(--accent)}
.review-cta{display:flex;gap:8px;flex-wrap:wrap}
.questions{margin-top:14px;background:color-mix(in srgb,var(--st-doing) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--st-doing) 40%,transparent);border-radius:var(--r);padding:12px 16px}
.questions ul{margin:6px 0 0;padding-left:18px}
.review-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:16px;margin-top:14px;align-items:start}
@media (max-width:980px){.review-grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-family:var(--f-display);font-size:19px;margin:0 0 10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.panel h4{font-size:12px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 6px;font-weight:500}
.panel ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.panel ul.plain li{display:flex;justify-content:space-between;gap:10px}
.pgroup{margin-bottom:16px}
.pgroup h3{font-size:15px;margin:0 0 6px}
.plan table{min-width:620px}
.plan td{padding:4px 6px;vertical-align:middle}
.cell{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px;color:var(--ink);font-size:14px}
.cell:hover,.cell:focus{border-color:var(--line);background:var(--bg)}
select.cell[data-empty="true"]{color:var(--st-block)}
.x{border:0;background:transparent;color:var(--muted);padding:4px 8px;border-radius:6px}
.x:hover{color:var(--st-block)}
.add{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:5px 10px;font-size:13px}

/* visite guidée */
.tour{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);pointer-events:none}

<script>
(function(){
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TODAY = "2026-11-02";
const DAY = 864e5;
const days = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / DAY);
const fmt = (d) => (d ? `${d.slice(8)}/${d.slice(5, 7)}` : "—");
const ST = { todo: ["À faire", "--st-todo"], doing: ["En cours", "--st-doing"], block: ["Bloqué", "--st-block"], done: ["Terminé", "--st-done"] };
const NEXT = { todo: "doing", doing: "block", block: "done", done: "todo" };

/* ------------------------------------------------------------ données d'exemple */
let uid = 100;
function T(group, name, status, owner, due, prio, subs, comments) {
  return { id: "t" + ++uid, group, name, status, owner, due, baseline: due, prio, subs: subs || null, comments: comments || [] };
}
const PROBLEM = { dependance_externe: "Dépendance externe", sous_estimation: "Sous-estimation", information_manquante: "Information manquante",
  changement_perimetre: "Changement de périmètre", surcharge: "Surcharge", probleme_technique: "Problème technique", autre: "Autre" };
function seed() {
  const st = seedBase();
  const note = (pid, name, author, type, problem, resolution, rating, validated) => {
    const t = st.projects.find((p) => p.id === pid).tasks.find((x) => x.name === name);
    t.note = { type, problem, resolution, author, rating, ratedBy: validated ? "Zaki" : author, validated, validatedBy: validated ? "Zaki" : null };
  };
  note("site", "Valider la maquette de la page d'accueil", "Léa", "dependance_externe", "Le client a mis 4 jours à donner son retour sur la maquette, ce qui a repoussé la validation.", "Relance quotidienne puis validation en visioconférence de 30 minutes avec le client.", 4, true);
  note("crm", "Inventorier les champs de l'ancien CRM", "Inès", "sous_estimation", "Il y avait trois fois plus de champs personnalisés que prévu.", "Une demi-journée ajoutée et tri des champs inutilisés avec l'équipe commerciale.", 2, true);
  note("crm", "Exporter les contacts", "Sami", "probleme_technique", "L'ancien CRM limite l'export à 1 000 contacts par fichier.", "Export en 6 tranches, puis fusion des fichiers avec un script.", 3, false);
  return st;
}
function seedBase() {
  return {
    view: "today", handled: [], resolved: {}, open: null, dates: {}, chats: {}, noteOpen: null, lessons: [], synth: false, newStep: "text", draft: null, intake: "",
    projects: [
      { id: "site", name: "Lancement du site web", example: true,
        description: "Refonte et mise en ligne du site vitrine d'une agence, avec pages services et formulaire de contact.",
        start: "2026-10-26", end: "2026-11-20",
        team: [["Zaki", "chef de projet"], ["Sami", "développeur"], ["Léa", "designer"], ["Inès", "communication"]],
        deliverables: [["Site en ligne", "2026-11-14"], ["Annonce publique", "2026-11-20"]],
        groups: ["Cette semaine", "Semaine prochaine", "Plus tard"],
        tasks: [
          T(0, "Valider la maquette de la page d'accueil", "done", "Léa", "2026-11-03", "Haute", [3, 3]),
          T(0, "Rédiger les textes des pages services", "doing", "Zaki", "2026-11-05", "Haute", [1, 4]),
          T(0, "Configurer le nom de domaine et le SSL", "block", "Sami", "2026-11-04", "Moyenne", [0, 2],
            [["Sami", "Il me manque les accès au registrar. @Zaki tu peux me les transmettre ?"]]),
          T(0, "Choisir les photos de l'équipe", "todo", "Inès", "2026-11-06", "Basse"),
          T(1, "Intégrer le formulaire de contact", "todo", "Sami", "2026-11-10", "Moyenne", [0, 3]),
          T(1, "Mettre en place les statistiques de visite", "todo", "Zaki", "2026-11-11", "Basse"),
          T(1, "Relire l'ensemble des pages", "todo", "Léa", "2026-11-12", "Moyenne"),
          T(2, "Préparer l'annonce sur LinkedIn", "todo", "Inès", "2026-11-18", "Basse"),
        ] },
      { id: "crm", name: "Migration du CRM", example: true,
        description: "Passage de l'ancien CRM à un nouvel outil, avec reprise des contacts et formation de l'équipe commerciale.",
        start: "2026-10-19", end: "2026-12-11",
        team: [["Zaki", "chef de projet"], ["Sami", "développeur"], ["Inès", "référente métier"]],
        deliverables: [["Données migrées", "2026-11-27"], ["Équipe formée", "2026-12-11"]],
        groups: ["Préparation", "Migration", "Formation"],
        tasks: [
          T(0, "Inventorier les champs de l'ancien CRM", "done", "Inès", "2026-10-30", "Haute"),
          T(0, "Exporter les contacts", "doing", "Sami", "2026-11-04", "Haute"),
          T(1, "Nettoyer les doublons", "todo", "Inès", "2026-11-13", "Moyenne"),
          T(1, "Importer et vérifier les données", "todo", "Sami", "2026-11-25", "Haute"),
          T(2, "Former l'équipe commerciale", "todo", "Zaki", "2026-12-09", "Moyenne"),
        ] },
    ],
  };
}
let S = seed();
const P = (id) => S.projects.find((p) => p.id === id);
const findTask = (pid, name) => P(pid).tasks.find((t) => t.name === name);

/* ------------------------------------------------------------ point du jour (même règles que l'application) */
function brief() {
  const items = [];
  const open = [];
  for (const p of S.projects) for (const t of p.tasks) if (t.status !== "done") open.push([p, t]);
  for (const [p, t] of open) {
    const base = { pid: p.id, project: p.name, task: t, team: p.team.map((m) => m[0]) };
    if (t.status === "block") {
      const last = t.comments.at(-1);
      items.push({ ...base, id: "blocked:" + t.id, kind: "Bloqué", sev: 3, title: `« ${t.name} » est bloquée`,
        detail: `${t.owner}, échéance ${fmt(t.due)}.${last ? ` Dernier message : « ${last[1]} »` : ""}`,
        actions: [["Proposer une solution", "solve", t.id], [`Relancer ${t.owner}`, "nudge", t.id]] });
      continue;
    }
    if (t.due && t.due < TODAY) {
      items.push({ ...base, id: "late:" + t.id, kind: "En retard", sev: 3, title: `« ${t.name} » a ${days(t.due, TODAY)} jour(s) de retard`,
        detail: `${t.owner}, prévue le ${fmt(t.due)}.`, actions: [["Demander la cause", "cause", t.id]] });
      continue;
    }
    if (t.due && days(TODAY, t.due) <= 3 && t.status === "todo") {
      items.push({ ...base, id: "soon:" + t.id, kind: "Échéance proche", sev: 2, title: `« ${t.name} » n'a pas commencé`,
        detail: `${t.owner}, échéance ${fmt(t.due)}.`, actions: [[`Vérifier avec ${t.owner}`, "nudge", t.id]] });
    }
    if (t.due && t.baseline && t.due > t.baseline) {
      const g = days(t.baseline, t.due);
      items.push({ ...base, id: "slip:" + t.id, kind: "Glissement", sev: g >= 5 ? 2 : 1, title: `« ${t.name} » a glissé de ${g} jour(s)`,
        detail: `Prévue le ${fmt(t.baseline)} dans le plan de référence, maintenant le ${fmt(t.due)}.`, actions: [["Voir les conséquences", "impact", t.id]] });
    }
  }
  const load = {};
  for (const [p, t] of open) (load[t.owner] ||= []).push([p, t]);
  for (const [who, list] of Object.entries(load)) {
    if (who === "null" || list.length < 4) continue;
    const projs = [...new Set(list.map(([p]) => p.name))];
    items.push({ pid: list[0][0].id, project: projs.join(" · "), id: "load:" + who, kind: "Surcharge", sev: projs.length > 1 ? 2 : 1,
      title: `${who} porte ${list.length} tâches ouvertes${projs.length > 1 ? ` sur ${projs.length} projets` : ""}`,
      detail: list.map(([, t]) => t.name).join(" · "), actions: [["Proposer un rééquilibrage", "rebalance", who]], tasks: list });
  }
  for (const p of S.projects) for (const [name, due] of p.deliverables) {
    if (!due || due < TODAY || days(TODAY, due) > 14) continue;
    const n = p.tasks.filter((t) => t.status !== "done" && (!t.due || t.due <= due)).length;
    if (!n) continue;
    items.push({ pid: p.id, project: p.name, id: "deliv:" + p.id + name, kind: "Livrable", sev: days(TODAY, due) <= 5 ? 3 : 2,
      title: `Livrable « ${name} » dans ${days(TODAY, due)} jours`, detail: `${n} tâche(s) encore ouverte(s) avant le ${fmt(due)}.`,
      actions: [["Est-ce tenable ?", "feasible", name]], tasks: p.tasks.filter((t) => t.status !== "done" && (!t.due || t.due <= due)).map((t) => [p, t]) });
  }
  items.sort((a, b) => b.sev - a.sev);
  return items;
}
function pulse(p) {
  const total = p.tasks.length, done = p.tasks.filter((t) => t.status === "done").length;
  const expected = Math.min(1, Math.max(0.02, days(p.start, TODAY) / Math.max(1, days(p.start, p.end))));
  const pace = total ? done / total / expected : 1;
  const its = brief().filter((i) => i.pid === p.id || i.project.includes(p.name));
  const state = its.some((i) => i.sev === 3) ? "late" : pace < 0.8 || its.length ? "watch" : "ok";
  return { total, done, pace, expected, state };
}
const STATE = { ok: ["Dans les temps", "var(--st-done)"], watch: ["À surveiller", "var(--st-doing)"], late: ["En retard", "var(--st-block)"] };

/* ------------------------------------------------------------ assistant (réponses préparées) */
function say(pid, role, text, extra) { (S.chats[pid] ||= []).push({ role, text, ...extra }); }
function assistantReply(pid, fn) { S.busy = true; render(); setTimeout(() => { S.busy = false; fn(); render(); tourCheck(); }, 900); }

function runAction(kind, arg, pid) {
  const p = P(pid);
  if (kind === "nudge") {
    const t = p.tasks.find((x) => x.id === arg);
    const blocked = t.status === "block";
    say(pid, "user", blocked ? `Relance ${t.owner} sur « ${t.name} » : demande où en est le blocage et ce dont il a besoin.` : `Vérifie avec ${t.owner} que « ${t.name} » tiendra le ${fmt(t.due)}.`);
    assistantReply(pid, () => {
      const msg = blocked
        ? `@${t.owner} où en es-tu sur ce point ? De quoi as-tu besoin pour avancer ? Je peux relancer l'ancien prestataire si c'est utile.`
        : `@${t.owner} l'échéance du ${fmt(t.due)} tient-elle toujours ? Dis-moi si quelque chose te bloque.`;
      t.comments.push(["Zaki (via l'assistant)", msg]); S.flash = t.id;
      say(pid, "assistant", `J'ai ajouté ce commentaire sur la tâche :\n« ${msg} »\n${t.owner} recevra une notification.`, { did: "✓ Commentaire ajouté sur la tâche" });
    });
  } else if (kind === "solve") {
    const t = p.tasks.find((x) => x.id === arg);
    say(pid, "user", `« ${t.name} » est bloquée. Propose des solutions.`);
    assistantReply(pid, () => say(pid, "assistant",
      `Cause probable : les accès au registrar sont chez l'ancien prestataire (dernier message de ${t.owner}).\n\n1. Vous récupérez les accès vous-même auprès de l'ancien prestataire aujourd'hui.\n2. On décale l'échéance au 06/11 pour laisser le temps de les obtenir.\n\nSi le blocage dure 3 jours de plus, « Intégrer le formulaire de contact » et le livrable « Site en ligne » du 14/11 sont menacés.`,
      { opts: [["M'assigner la récupération des accès", "takeover", t.id], ["Décaler au 06/11", "postpone", t.id]] }));
  } else if (kind === "takeover") {
    const t = p.tasks.find((x) => x.id === arg);
    say(pid, "user", "M'assigner la récupération des accès.");
    assistantReply(pid, () => { t.owner = "Zaki"; t.status = "doing"; S.flash = t.id;
      say(pid, "assistant", `C'est fait : la tâche est maintenant à vous, au statut En cours. Elle n'apparaît plus comme bloquée dans le point du jour.`, { did: "✓ Responsable : Zaki · Statut : En cours" }); });
  } else if (kind === "postpone") {
    const t = p.tasks.find((x) => x.id === arg);
    say(pid, "user", "Décaler au 06/11.");
    assistantReply(pid, () => { t.due = "2026-11-06"; S.flash = t.id;
      say(pid, "assistant", `Échéance décalée au 06/11. Le plan de référence garde le 04/11 : l'écart de 2 jours reste visible dans le tableau (« prévu 04/11 »).`, { did: "✓ Échéance : 06/11 (prévu 04/11)" }); });
  } else if (kind === "rebalance") {
    say(pid, "user", `${arg} est surchargé. Propose un rééquilibrage, sans rien modifier avant mon accord.`);
    assistantReply(pid, () => say(pid, "assistant",
      `${arg} a 4 tâches ouvertes sur 2 projets, dont 2 cette semaine.\nJe propose de confier « Intégrer le formulaire de contact » (10/11) à Zaki, qui n'a qu'une tâche ouverte ce jour-là.`,
      { opts: [["Appliquer", "reassign", "Intégrer le formulaire de contact"]] }));
  } else if (kind === "reassign") {
    const t = findTask(pid, arg);
    say(pid, "user", "Appliquer.");
    assistantReply(pid, () => { t.owner = "Zaki"; S.flash = t.id;
      say(pid, "assistant", `« ${t.name} » est confiée à Zaki. Sami passe à 3 tâches ouvertes : l'alerte de surcharge disparaît.`, { did: "✓ Responsable : Zaki" }); });
  } else if (kind === "feasible") {
    say(pid, "user", `Le livrable « ${arg} » est-il tenable ?`);
    assistantReply(pid, () => {
      const blocked = p.tasks.some((t) => t.status === "block");
      say(pid, "assistant", blocked
        ? `Tenable, mais serré. 6 tâches restent avant le 14/11 et le SSL est bloqué : sans nom de domaine, le site ne peut pas être mis en ligne. Priorité : débloquer le SSL d'ici le 06/11.`
        : `Tenable. Le blocage du SSL est levé ; les 6 tâches restantes tiennent avant le 14/11 si le formulaire de contact avance cette semaine.`);
    });
  } else if (kind === "cause" || kind === "impact") {
    const t = p.tasks.find((x) => x.id === arg);
    say(pid, "user", kind === "cause" ? `Demande la cause du retard de « ${t.name} ».` : `Quelles conséquences du glissement de « ${t.name} » ?`);
    assistantReply(pid, () => say(pid, "assistant", kind === "cause"
      ? `J'ai demandé à ${t.owner}, sans reproche, la cause du retard et une nouvelle date. Sa réponse sera ensuite évaluée par le chef de projet (poids de 1 à 5).`
      : `Ce glissement repousse les tâches qui en dépendent de quelques jours ; aucun livrable n'est menacé pour l'instant.`));
  }
}
function freeText(pid, text) {
  say(pid, "user", text);
  const n = text.toLowerCase();
  assistantReply(pid, () => {
    const p = P(pid);
    if (/résum|resum|point/.test(n)) {
      const c = (s) => p.tasks.filter((t) => t.status === s).length;
      say(pid, "assistant", `${p.name} : ${p.tasks.length} tâches, ${c("done")} terminée(s), ${c("doing")} en cours, ${c("block")} bloquée(s), ${c("todo")} à faire. Fin prévue le ${fmt(p.end)}.`);
    } else if (/bloqu/.test(n)) {
      const b = p.tasks.filter((t) => t.status === "block");
      say(pid, "assistant", b.length ? "Bloqué : " + b.map((t) => `« ${t.name} » (${t.owner})`).join(", ") : "Rien n'est bloqué dans ce projet.");
    } else if (/charg|surcharg/.test(n)) {
      const m = {}; p.tasks.filter((t) => t.status !== "done").forEach((t) => (m[t.owner] = (m[t.owner] || 0) + 1));
      say(pid, "assistant", "Tâches ouvertes : " + Object.entries(m).map(([k, v]) => `${k} ${v}`).join(", ") + ".");
    } else {
      say(pid, "assistant", "Dans cette démo, mes réponses sont préparées à l'avance : essayez « Résume le projet », « Qu'est-ce qui bloque ? » ou « Qui est le plus chargé ? ». Dans l'outil réel, Claude répond à toutes les demandes et peut modifier le projet.");
    }
  });
}

/* ------------------------------------------------------------ nouveau projet */
const EXAMPLE = `Bonjour,

Nous déménageons nos bureaux le 19 décembre, du 3e étage actuel vers les nouveaux locaux du 1250 boulevard Central. 40 postes de travail à déplacer.

Zaki pilote le projet. Inès s'occupe de l'aménagement (plans, mobilier), Sami de l'informatique (réseau, postes, téléphonie) et Nora, des services généraux, gère le déménageur et les clés.

Le propriétaire doit nous remettre les clés le 1er décembre. Il faut que tout le monde puisse travailler normalement le lundi 22 décembre.

Livrables : plan d'aménagement validé le 20 novembre, réseau opérationnel dans les nouveaux locaux le 15 décembre, déménagement terminé le 19 décembre.`;

function exampleDraft() {
  return {
    name: "Déménagement des bureaux", start: "2026-11-09", end: "2026-12-22",
    description: "Déménager 40 postes vers les nouveaux locaux du 1250 boulevard Central, pour une reprise normale du travail le 22 décembre.",
    deliverables: [["Plan d'aménagement validé", "2026-11-20"], ["Réseau opérationnel", "2026-12-15"], ["Déménagement terminé", "2026-12-19"]],
    stakeholders: [["Propriétaire des nouveaux locaux", "remet les clés le 1er décembre"], ["Déménageur", "à choisir"], ["Employés", "40 postes concernés"]],
    team: [["Zaki", "chef de projet"], ["Inès", "aménagement"], ["Sami", "informatique"], ["Nora", "services généraux"]],
    groups: [
      ["Préparation", [["Faire le plan d'aménagement", "Inès", "2026-11-18", "Haute"], ["Faire valider le plan par la direction", "Zaki", "2026-11-20", "Haute"], ["Obtenir 3 devis de déménageurs", "Nora", "2026-11-20", "Haute"]]],
      ["Informatique", [["Commander la ligne internet des nouveaux locaux", "Sami", "2026-11-13", "Haute"], ["Câbler et tester le réseau", "Sami", "2026-12-15", "Haute"], ["Préparer la bascule de la téléphonie", "Sami", "2026-12-17", "Moyenne"]]],
      ["Déménagement", [["Réserver le déménageur", "Nora", "2026-11-27", "Haute"], ["Récupérer les clés", "Nora", "2026-12-01", "Moyenne"], ["Informer les employés du calendrier", "Zaki", "2026-12-03", "Moyenne"], ["Déménager les postes", null, "2026-12-19", "Haute"]]],
    ],
    questions: ["Le budget du déménagement est-il déjà approuvé ?", "Le délai de 6 semaines pour la ligne internet est-il confirmé par l'opérateur ?"],
  };
}
function genericDraft(text) {
  const first = text.split("\n").map((l) => l.trim()).find((l) => l.length > 8) || "Nouveau projet";
  return {
    name: first.slice(0, 60), start: "2026-11-09", end: "2026-12-18",
    description: text.slice(0, 220), deliverables: [["Livrable principal", "2026-12-18"]], stakeholders: [],
    team: [["Zaki", "chef de projet"], ["Membre 2", "réalisation"]],
    groups: [["Cadrage", [["Préciser l'objectif et le périmètre", "Zaki", "2026-11-13", "Haute"]]], ["Réalisation", [["Réaliser le livrable", "Membre 2", "2026-12-11", "Haute"], ["Valider le livrable", "Zaki", "2026-12-18", "Haute"]]]],
    questions: ["Dans cette démo, un texte personnel donne un plan simplifié. L'outil réel analyse votre texte avec Claude pour proposer un vrai plan."],
  };
}
function createFromDraft() {
  const d = S.draft;
  const id = "p" + ++uid;
  const tasks = [];
  d.groups.forEach(([, ts], gi) => ts.forEach(([name, owner, due, prio]) => tasks.push(T(gi, name, "todo", owner, due, prio))));
  S.projects.push({ id, name: d.name || "Projet sans nom", example: false, isNew: true, description: d.description, start: d.start, end: d.end,
    team: d.team, deliverables: d.deliverables, groups: d.groups.map(([g]) => g), tasks });
  S.newStep = "text"; S.draft = null; S.intake = "";
  go(id);
  toast(`Projet créé : ${tasks.length} tâches, plan de référence figé.`);
}

/* ------------------------------------------------------------ rendu */

/* ------------------------------------------------------------ résolution sur place (sans IA) */
let ME = "Zaki";
const isPM = (p, name) => !!p.team.find(([n, r]) => n === name && /chef de projet/i.test(r));
const isLate = (t) => (t.status !== "done" && t.due && t.due < TODAY) || (t.baseline && t.due && t.due > t.baseline);
function quickButtons(i) {
  const t = i.task, b = (q, label, primary) => `<button class="btn ${primary ? "primary" : ""}" data-q="${q}" data-item="${esc(i.id)}">${esc(label)}</button>`;
  const canTake = t && i.team.includes(ME) && t.owner !== ME;
  const date = t ? b("date", S.open === i.id ? "Fermer" : "Nouvelle date") : "";
  switch (i.kind) {
    case "Bloqué": return (canTake ? b("take", "Je m'en occupe", true) : "") + b("unblock", "C'est débloqué", !canTake) + date + (t.owner && t.owner !== ME ? b("nudge", `Relancer ${t.owner}`) : "");
    case "En retard": return b("done", "C'est terminé", true) + date + (t.owner && t.owner !== ME ? b("why", "Demander la cause") : "");
    case "Échéance proche": return b("start", "Marquer En cours", true) + (t.owner && t.owner !== ME ? b("nudge", `Vérifier avec ${t.owner}`) : "") + date;
    case "Glissement": return b("ack", "Accepter le glissement", true) + date;
    case "Surcharge": return b("open", S.open === i.id ? "Fermer" : "Rééquilibrer", true);
    case "Livrable": return b("open", S.open === i.id ? "Fermer" : "Voir les tâches", true);
  }
  return "";
}
function quickPanel(i) {
  if (S.open !== i.id) return "";
  if (i.task) {
    const t = i.task, v = S.dates[i.id] || t.due;
    return `<div class="resolve"><label>Nouvelle échéance pour « ${esc(t.name)} »<input type="date" id="due-${esc(i.id)}" data-due="${esc(i.id)}" value="${v}" min="${TODAY}"></label>
      <button class="btn primary" data-q="setdate" data-item="${esc(i.id)}">Valider</button></div>`;
  }
  return `<div class="resolve list">${i.tasks.map(([p, t]) => `<div class="rrow"><span class="rname">${esc(t.name)}<span class="muted"> · ${ST[t.status][0]} · ${fmt(t.due)}${i.kind === "Surcharge" ? " · " + esc(p.name) : ""}</span></span>
      <select data-reassign="${t.id}" data-item="${esc(i.id)}" aria-label="Responsable de « ${esc(t.name)} »"><option value="">— à assigner</option>${p.team.map(([m]) => `<option ${m === t.owner ? "selected" : ""}>${esc(m)}</option>`).join("")}</select></div>`).join("")}
    <p class="muted" style="margin:0">Choisir un autre membre de l'équipe du projet applique le changement tout de suite.</p></div>`;
}
function resolveItem(item, summary, undo) {
  S.resolved[item.id] = { item, summary, undo }; S.open = null;
  setTimeout(() => { if (S.resolved[item.id]) { delete S.resolved[item.id]; if (S.view === "today") render(); } }, 12000);
  render(); tourCheck();
}
function change(item, t, patch, summary) {
  const before = {}; for (const k in patch) before[k] = t[k];
  Object.assign(t, patch); S.flash = t.id;
  resolveItem(item, summary, () => Object.assign(t, before));
}
function quick(q, id, value) {
  const item = brief().find((x) => x.id === id) || S.resolved[id]?.item; if (!item) return;
  const t = item.task;
  if (q === "take") change(item, t, { owner: ME, status: "doing" }, `Vous reprenez « ${t.name} », passée En cours.`);
  else if (q === "unblock" || q === "start") change(item, t, { status: "doing" }, `« ${t.name} » est passée En cours.`);
  else if (q === "done") change(item, t, { status: "done" }, `« ${t.name} » est marquée Terminée.`);
  else if (q === "nudge" || q === "why") {
    t.comments.push([ME, q === "why" ? `@${t.owner} qu'est-ce qui a retardé « ${t.name} », et quelle nouvelle date te paraît réaliste ? (pas de reproche : c'est pour mieux planifier)` : `@${t.owner} où en es-tu sur « ${t.name} » ? De quoi as-tu besoin pour avancer ?`]);
    resolveItem(item, `Relance envoyée à ${t.owner} dans le fil de la tâche.`);
  }
  else if (q === "ack") { S.handled.push(id); render(); }
  else if (q === "date" || q === "open") { S.open = S.open === id ? null : id; render(); }
  else if (q === "setdate") { const v = S.dates[id] || t.due; if (v && v !== t.due) change(item, t, { due: v }, `Échéance de « ${t.name} » passée au ${fmt(v)}. L'écart avec le plan de référence reste visible.`); }
  else if (q === "reassign") {
    const [p, task] = item.tasks.find(([, x]) => x.id === value.task);
    change(item, task, { owner: value.owner || null }, `« ${task.name} » est confiée à ${value.owner || "personne"}.`);
  }
}

        <select id="askp" aria-label="Projet concerné">${S.projects.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select>
        <button class="go">Demander</button></form>
      <button class="ghostlink" data-go="new">+ Démarrer un nouveau projet à partir d'un texte</button>
    </section>
    <div class="pulse" id="pulse">${S.projects.map((p) => { const u = pulse(p); return `<button class="pcard" data-go="${p.id}">
      <span class="row"><span class="name">${esc(p.name)}${p.example ? '<span class="ex">exemple</span>' : ""}</span><span class="chip ${u.state}">${STATE[u.state][0]}</span></span>
      <span class="track" role="img" aria-label="${u.done} tâches terminées sur ${u.total}"><span class="fill" style="width:${(u.done / u.total) * 100}%"></span><span class="expect" style="left:calc(${u.expected * 100}% - 1px)" title="Avancement attendu aujourd'hui"></span></span>

    <div class="section-h"><h2>À décider aujourd'hui</h2><span class="muted">${urgent.length ? urgent.length + " point(s)" : "Rien d'urgent"}</span></div>

    ${later.length ? `<div class="section-h"><h2>À surveiller cette semaine</h2><span class="muted">${later.length} point(s)</span></div><div class="cards">${later.map(card).join("")}</div>` : ""}

/* ------------------------------------------------------------ notes, évaluation, validation */
const RATING_HELP = "Évaluation du retard et de son explication, de 1 (peu fiable ou peu utile) à 5 (cause réelle, leçon importante). Proposée par le responsable ou le chef de projet.";
const VALIDATE_HELP = "Case réservée au chef de projet : valide la note et son évaluation. Seules les notes validées servent à l'apprentissage. Toute modification décoche la case.";
const canEditNote = (p, t) => t.owner === ME || isPM(p, ME);
function stars(t, editable) {
  const v = t.note?.rating || 0;
  return `<span class="stars">${[1, 2, 3, 4, 5].map((n) => editable
    ? `<button class="${n <= v ? "on" : ""}" data-rate="${t.id}" data-n="${n}" aria-label="Évaluer ${n} sur 5">★</button>`
    : `<span class="${n <= v ? "on" : ""}">★</span>`).join("")}</span>`;
}
function noteCell(p, t) {
  if (t.note) return `<button class="note-btn" data-note="${t.id}"><span class="ptype">${PROBLEM[t.note.type]}</span><span class="excerpt">${esc(t.note.problem)}</span></button>`;
  if (isLate(t)) return `<button class="note-btn due" data-note="${t.id}">Explication attendue</button>`;
  return canEditNote(p, t) ? `<button class="note-btn add" data-note="${t.id}">+ Ajouter</button>` : `<span class="muted">—</span>`;
}
function ratingCell(p, t) {
  if (!t.note) return `<span class="muted">—</span>`;
  return `<span class="rating-cell" title="${esc(RATING_HELP)}">${stars(t, canEditNote(p, t))}${t.note.rating ? "" : '<span class="pending">à évaluer</span>'}</span>`;
}
function validateCell(p, t) {
  if (!t.note) return `<span class="muted">—</span>`;
  const pm = isPM(p, ME), ready = !!t.note.rating;
  const title = !pm ? "Réservé au chef de projet (lecture seule pour vous)" : !ready ? "Évaluez d'abord la note de 1 à 5." : VALIDATE_HELP;
  return `<label class="validate-box ${t.note.validated ? "on" : ""}" title="${esc(title)}"><input type="checkbox" data-validate="${t.id}" ${t.note.validated ? "checked" : ""} ${!pm || (!ready && !t.note.validated) ? "disabled" : ""} aria-label="Valider la note de « ${esc(t.name)} »"><span>${t.note.validated ? "Validé" : pm ? "Valider" : "Non validé"}</span></label>`;
}
function notePanel(p, t) {
  const n = t.note || { type: "autre", problem: "", resolution: "" }, edit = canEditNote(p, t);
  return `<div class="note-panel" id="note-panel"><div class="note-panel-head"><strong>Note · ${esc(t.name)}</strong><button class="x" data-note="${t.id}" aria-label="Fermer">✕</button></div>
    <div class="note-grid">
      <label>Type de problème<select id="nt" ${edit ? "" : "disabled"}>${Object.entries(PROBLEM).map(([k, v]) => `<option value="${k}" ${k === n.type ? "selected" : ""}>${v}</option>`).join("")}</select></label>
      <label>Problème : que s'est-il passé ?<textarea id="np" rows="3" ${edit ? "" : "disabled"} placeholder="Ex. Le fournisseur a livré l'accès avec 5 jours de retard.">${esc(n.problem)}</textarea></label>
      <label>Résolution : comment l'avez-vous résolu (ou comment le résoudre) ?<textarea id="nr" rows="3" ${edit ? "" : "disabled"} placeholder="Ex. Relance quotidienne et accès provisoire demandé en parallèle.">${esc(n.resolution)}</textarea></label>
    </div>
    <div class="note-foot"><span class="muted">${t.note ? `Note de ${esc(t.note.author)} · ${t.note.rating ? `évaluée ${t.note.rating}/5 par ${esc(t.note.ratedBy)}` : "pas encore évaluée"} · ${t.note.validated ? `validée par ${esc(t.note.validatedBy)}` : "pas encore validée"}` : edit ? "Rédigée par le responsable de la tâche (ou le chef de projet)." : "Seul le responsable de la tâche ou le chef de projet peut écrire la note."}</span>
      ${edit ? `<button class="btn primary" data-savenote="${t.id}">${t.note ? "Enregistrer la note" : "Ajouter la note"}</button>` : ""}</div>
    ${t.note ? `<div class="validate"><strong>Évaluation</strong>${stars(t, edit)}${validateCell(p, t)}<span class="muted">${esc(RATING_HELP)}</span></div>` : ""}
  </div>`;
}
function findTaskById(id) { for (const p of S.projects) { const t = p.tasks.find((x) => x.id === id); if (t) return [p, t]; } return [null, null]; }

/* ------------------------------------------------------------ leçons apprises */
const LESSON = {
  dependance_externe: ["Fixer un délai de réponse avec les tiers", "Un client ou un fournisseur tarde à répondre et bloque une étape.", "Au cadrage, convenir d'un délai de réponse avec chaque tiers et prévoir une réunion courte de validation."],
  sous_estimation: ["Prévoir une marge sur les tâches d'inventaire", "Le volume réel dépasse l'estimation de départ.", "Ajouter une marge aux tâches d'inventaire et de reprise de données."],
  probleme_technique: ["Tester les limites techniques dès la semaine 1", "Une limite technique d'un outil existant ralentit le travail.", "Faire un essai complet (export, accès, volumes) dès la première semaine."],
  information_manquante: ["Valider les informations d'entrée avant de commencer", "Une information attendue manque au moment de commencer.", "Lister au cadrage les informations nécessaires et leur fournisseur."],
  changement_perimetre: ["Faire valider tout changement de périmètre", "Le besoin change en cours de route.", "Mettre en place une validation écrite des changements de périmètre."],
  surcharge: ["Vérifier la charge sur tous les projets avant d'assigner", "Une personne est engagée sur plusieurs projets en même temps.", "Consulter la charge inter-projets au moment des assignations."],
  autre: ["Leçon à préciser", "Cause diverse.", "Revoir ces cas en réunion de fin de projet."],
};
function validatedNotes() { const out = []; for (const p of S.projects) for (const t of p.tasks) if (t.note?.validated) out.push([p, t]); return out; }
function synthesize() {
  S.synth = true; render();
  setTimeout(() => {
    const by = {};
    for (const [p, t] of validatedNotes()) (by[t.note.type] ||= []).push([p, t]);
    S.lessons = Object.entries(by).map(([type, list]) => {
      const w = Math.round((list.reduce((a, [, t]) => a + t.note.rating, 0) / list.length) * 10) / 10;
      const [title, problem, reco] = LESSON[type];
      return { type, title, problem, resolution: list.map(([, t]) => t.note.resolution).filter(Boolean).join(" "), reco: reco + (w < 3 ? " (leçon de faible poids, à confirmer)" : ""), weight: w, sources: list.map(([p, t]) => `${t.name} (${p.name})`) };
    }).sort((a, b) => b.weight - a.weight);
    S.synth = false; render(); tourCheck();
  }, 1200);
}
function renderLessons() {
  const notes = validatedNotes();
  const stats = {}; for (const [, t] of notes) { const x = (stats[t.note.type] ||= { n: 0, w: 0 }); x.n++; x.w += t.note.rating; }
  const max = Math.max(1, ...Object.values(stats).map((x) => x.w));
  return `<div class="lessons" id="lessons"><div class="lessons-head"><div><h1 class="ltitle">Leçons apprises</h1>
      <p class="muted">À partir des notes de retard <strong>validées par les chefs de projet</strong>, pondérées par leur évaluation de 1 à 5.</p></div>
      <button class="btn primary" id="synth" ${S.synth || !notes.length ? "disabled" : ""}>${S.synth ? "Analyse en cours…" : "Synthétiser avec l'IA"}</button></div>
    <div class="lessons-grid"><section class="panel"><h2>Par type de problème <span class="muted">sans IA</span></h2>
      ${Object.entries(stats).sort((a, b) => b[1].w - a[1].w).map(([k, x]) => `<div class="stat"><div class="stat-row"><span>${PROBLEM[k]}</span><span class="mono muted">${x.n} note(s) · moyenne ${Math.round((x.w / x.n) * 10) / 10}/5</span></div><div class="track"><span class="fill" style="width:${(x.w / max) * 100}%"></span></div></div>`).join("") || '<p class="muted">Aucune note validée.</p>'}
      <h2 style="margin-top:20px">Notes validées <span class="muted">${notes.length}</span></h2>
      <ul class="vnotes">${notes.map(([p, t]) => `<li><div class="vtop"><span class="ptype">${PROBLEM[t.note.type]}</span>${stars(t, false)}</div><strong>${esc(t.name)}</strong> <span class="muted">· ${esc(p.name)} · ${esc(t.note.author)}</span><p><b>Problème :</b> ${esc(t.note.problem)}</p>${t.note.resolution ? `<p><b>Résolution :</b> ${esc(t.note.resolution)}</p>` : ""}</li>`).join("")}</ul></section>
    <section class="panel"><h2>Leçons <span class="muted">${S.lessons.length ? "synthèse de l'IA (préparée pour la démo)" : "aucune synthèse pour l'instant"}</span></h2>
      ${S.lessons.length ? "" : `<p class="muted">Lancez « Synthétiser avec l'IA » : l'assistant regroupe les notes validées par type de problème et en tire ce qui a marché et quoi faire dès le cadrage des prochains projets.</p>`}
      ${S.lessons.map((l) => `<article class="lesson"><div class="vtop"><span class="ptype">${PROBLEM[l.type]}</span><span class="mono muted" title="Moyenne des évaluations des notes sources">poids ${l.weight}/5</span></div><h3>${esc(l.title)}</h3><p><b>Problème type :</b> ${esc(l.problem)}</p><p><b>Ce qui a marché :</b> ${esc(l.resolution)}</p><p class="reco"><b>À faire dès le cadrage :</b> ${esc(l.reco)}</p><p class="muted">Sources : ${l.sources.map(esc).join(" · ")}</p></article>`).join("")}
    </section></div></div>`;
}

      ${msgs.map((m) => `<div class="msg ${m.role}">${esc(m.text)}${m.did ? `<div class="did">${esc(m.did)}</div>` : ""}${m.opts ? `<div class="opts">${m.opts.map(([l, k, a]) => `<button class="btn primary" data-act="${k}" data-arg="${esc(a)}" data-pid="${p.id}">${esc(l)}</button>`).join("")}</div>` : ""}</div>`).join("")}
      ${S.busy ? `<div class="msg assistant muted">Je réfléchis…</div>` : ""}</div>
    <div class="sugg">${["Résume le projet", "Qu'est-ce qui bloque ?", "Qui est le plus chargé ?"].map((s) => `<button type="button" data-say="${s}">${s}</button>`).join("")}</div>
    <form id="chatform"><input id="chatq" placeholder="Votre demande…" aria-label="Message à l'assistant"><button class="btn primary">Envoyer</button></form>
  </aside></div>`;
}

function renderNew() {
  if (S.newStep === "text" || S.newStep === "loading") {
    const loading = S.newStep === "loading";
    return `<section class="hero"><div class="date">Nouveau projet</div><h1>Racontez-moi le projet.</h1>
      <p class="headline">Collez un brief, un courriel ou vos notes. L'assistant prépare le contexte, l'équipe et un plan complet, que vous relirez avant de créer le projet.</p>
      ${loading ? `<div class="loading" id="loading"><div class="on">→ Je lis le texte…</div><div>→ Je repère les dates, les livrables et l'équipe…</div><div>→ Je découpe le travail en phases et en tâches…</div></div>` :
      `<div class="intake-box"><textarea id="intake" rows="10" placeholder="Objectif, dates, livrables, qui fait quoi, contraintes… Écrivez comme à un collègue." aria-label="Description du projet">${esc(S.intake)}</textarea>
        <div class="intake-actions"><button class="btn ghost" id="useex">Utiliser l'exemple (déménagement de bureaux)</button><span style="flex:1"></span>
        <button class="go" id="prepare" ${S.intake.trim().length < 20 ? "disabled" : ""}>Préparer le projet</button></div></div>`}
      <button class="ghostlink" data-go="today">← Retour à Aujourd'hui</button></section>`;
  }
  const d = S.draft;
  const n = d.groups.reduce((k, [, ts]) => k + ts.length, 0);
  const un = d.groups.reduce((k, [, ts]) => k + ts.filter((t) => !t[1]).length, 0);
  return `<div class="review-head"><div><div class="muted">Relisez et corrigez : rien n'est enregistré avant votre validation.</div>
      <input class="title-input" id="dname" value="${esc(d.name)}" aria-label="Nom du projet"></div>
      <div class="review-cta"><button class="btn" id="restartnew">Recommencer</button><button class="btn primary" id="create" style="padding:10px 16px">Créer le projet et figer le plan (${n} tâches)</button></div></div>
    <aside class="questions" id="questions"><strong>À préciser</strong> <span class="muted">· ce que l'assistant n'a pas pu déduire du texte</span><ul>${d.questions.map((q) => `<li>${esc(q)}</li>`).join("")}</ul></aside>
    <div class="review-grid"><section class="panel"><h2>Contexte</h2><p style="margin:0">${esc(d.description)}</p>
      <p class="muted mono">Du ${fmt(d.start)} au ${fmt(d.end)}</p>
      <h4>Livrables</h4><ul class="plain">${d.deliverables.map(([x, y]) => `<li><span>${esc(x)}</span><span class="mono">${fmt(y)}</span></li>`).join("")}</ul>
      ${d.stakeholders.length ? `<h4>Parties prenantes</h4><ul class="plain">${d.stakeholders.map(([x, y]) => `<li><span>${esc(x)}</span><span class="muted">${esc(y)}</span></li>`).join("")}</ul>` : ""}
      <h4>Équipe</h4><ul class="plain">${d.team.map(([x, y]) => `<li><span>${esc(x)}</span><span class="muted">${esc(y)}</span></li>`).join("")}</ul></section>
    <section class="panel plan" id="plan"><h2>Plan <span class="muted">${n} tâches${un ? ` · ${un} sans responsable` : ""}</span></h2>
      ${d.groups.map(([g, ts], gi) => `<div class="pgroup"><h3>${esc(g)}</h3><div class="tscroll"><table><tbody>
        ${ts.map(([name, owner, due, prio], ti) => `<tr><td><input class="cell" id="tn-${gi}-${ti}" value="${esc(name)}" data-g="${gi}" data-t="${ti}" data-f="0" aria-label="Tâche"></td>
          <td style="width:150px"><select class="cell" id="to-${gi}-${ti}" data-g="${gi}" data-t="${ti}" data-f="1" data-empty="${!owner}" aria-label="Responsable"><option value="">— à assigner</option>${d.team.map(([m]) => `<option ${m === owner ? "selected" : ""}>${esc(m)}</option>`).join("")}</select></td>
          <td style="width:160px"><input class="cell mono" id="td-${gi}-${ti}" type="date" value="${due}" data-g="${gi}" data-t="${ti}" data-f="2" aria-label="Échéance"></td>
          <td style="width:40px"><button class="x" data-del="${gi}-${ti}" aria-label="Retirer la tâche">✕</button></td></tr>`).join("")}
        </tbody></table></div><button class="add" data-addt="${gi}">+ Tâche</button></div>`).join("")}
    </section></div>`;
}

function render() {
  renderNav();
  const m = $("#main");
  m.innerHTML = S.view === "today" ? renderToday() : S.view === "new" ? renderNew() : S.view === "lessons" ? renderLessons() : renderProject(P(S.view));
  const log = $("#log"); if (log) log.scrollTop = 1e6;
  if (S.flash) { const row = $("#row-" + S.flash); if (row) row.scrollIntoView({ block: "center", behavior: "smooth" }); S.flash = null; }
  renderTour();
}

/* ------------------------------------------------------------ événements */
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.go) return go(b.dataset.go);
  if (b.dataset.act) {
    if (b.dataset.item) S.handled.push(b.dataset.item);
    if (S.view !== b.dataset.pid) S.view = b.dataset.pid;
    window.scrollTo({ top: 0 });
    runAction(b.dataset.act, b.dataset.arg, b.dataset.pid); render(); tourCheck(); return;
  }
  if (b.dataset.q) { quick(b.dataset.q, b.dataset.item); return; }
  if (b.dataset.note) { S.noteOpen = S.noteOpen === b.dataset.note ? null : b.dataset.note; render(); $("#note-panel")?.scrollIntoView({ block: "nearest", behavior: "smooth" }); return; }
  if (b.dataset.rate) {
    const [p, t] = findTaskById(b.dataset.rate); if (!canEditNote(p, t)) return;
    const n = +b.dataset.n; if (t.note.rating === n) return;
    const was = t.note.validated; Object.assign(t.note, { rating: n, ratedBy: ME, validated: false, validatedBy: null }); render();
    toast(was ? `Évaluée ${n}/5. La validation a été décochée : le chef de projet doit revalider.` : `Évaluée ${n}/5.`); return;
  }
  if (b.dataset.savenote) {
    const [p, t] = findTaskById(b.dataset.savenote); if (!canEditNote(p, t)) return;
    const type = $("#nt").value, problem = $("#np").value.trim(), resolution = $("#nr").value.trim();
    if (problem.length < 5) { toast("Décrivez le problème en quelques mots."); return; }
    const was = t.note?.validated, changed = !t.note || t.note.type !== type || t.note.problem !== problem || t.note.resolution !== resolution;
    if (!changed) return;
    t.note = { ...(t.note || { rating: null, ratedBy: null }), type, problem, resolution, author: ME, validated: false, validatedBy: null };
    S.flash = t.id; render(); toast(was ? "Note enregistrée. La validation a été décochée : le chef de projet doit revalider." : "Note enregistrée."); return;
  }
  if (b.id === "synth") { synthesize(); return; }
  if (b.dataset.undo) { const r = S.resolved[b.dataset.undo]; if (r?.undo) { r.undo(); delete S.resolved[b.dataset.undo]; render(); toast("Annulé."); } return; }
  if (b.dataset.later) { S.handled.push(b.dataset.later); render(); toast("Masqué jusqu'à demain."); return; }
  if (b.id === "unhide") { S.handled = []; render(); return; }
  if (b.dataset.cycle) { for (const p of S.projects) { const t = p.tasks.find((x) => x.id === b.dataset.cycle); if (t) { t.status = NEXT[t.status]; S.flash = null; } } render(); return; }
  if (b.dataset.say) { freeText(S.view, b.dataset.say); return; }
  if (b.id === "useex") { S.intake = EXAMPLE; render(); tourCheck(); return; }
  if (b.id === "prepare") return prepare();
  if (b.id === "restartnew") { S.newStep = "text"; S.draft = null; render(); return; }
  if (b.id === "create") return createFromDraft();
  if (b.dataset.del) { const [g, t] = b.dataset.del.split("-").map(Number); S.draft.groups[g][1].splice(t, 1); render(); return; }
  if (b.dataset.addt) { S.draft.groups[+b.dataset.addt][1].push(["Nouvelle tâche", null, S.draft.end, "Moyenne"]); render(); return; }
  if (b.id === "restart") { S = seed(); ME = "Zaki"; $("#asuser").value = "Zaki"; tourIdx = 0; tourOpen = true; render(); return; }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "intake") { S.intake = e.target.value; const p = $("#prepare"); if (p) p.disabled = S.intake.trim().length < 20; }
  if (e.target.id === "dname") S.draft.name = e.target.value;
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.id === "asuser") { ME = el.value; render(); toast(`Vous voyez l'outil comme ${ME}.`); return; }
  if (el.dataset.validate) {
    const [p, t] = findTaskById(el.dataset.validate);
    if (!isPM(p, ME)) { el.checked = !el.checked; return; }
    t.note.validated = el.checked; t.note.validatedBy = el.checked ? ME : null; render(); tourCheck();
    toast(el.checked ? "Note validée : elle comptera dans les leçons apprises." : "Validation retirée."); return;
  }
  if (el.dataset.due) { S.dates[el.dataset.due] = el.value; return; }
  if (el.dataset.reassign) { quick("reassign", el.dataset.item, { task: el.dataset.reassign, owner: el.value }); return; }
  if (el.dataset.owner) {
    const t = P(S.view).tasks.find((x) => x.id === el.dataset.owner);
    t.owner = el.value || null; S.flash = t.id; render();
    toast(t.owner ? `« ${t.name} » est confiée à ${t.owner}.` : `« ${t.name} » n'a plus de responsable.`);
    return;
  }
  if (el.dataset.f === undefined || !S.draft) return;
  const row = S.draft.groups[+el.dataset.g][1][+el.dataset.t];
  row[+el.dataset.f] = el.value || null; render();
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.id === "chatform") { const v = $("#chatq").value.trim(); if (v) freeText(S.view, v); }
  if (e.target.id === "askform") { const v = $("#askq").value.trim(); if (v) { const pid = $("#askp").value; S.view = pid; freeText(pid, v); } }
});
function prepare() {
  S.newStep = "loading"; render();
  const lines = () => [...document.querySelectorAll("#loading div")];
  setTimeout(() => lines()[1]?.classList.add("on"), 500);
  setTimeout(() => lines()[2]?.classList.add("on"), 1000);
  setTimeout(() => { S.draft = S.intake.trim() === EXAMPLE.trim() ? exampleDraft() : genericDraft(S.intake); S.newStep = "review"; render(); tourCheck(); }, 1600);
}
let tt; function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => (t.hidden = true), 2800); }

/* ------------------------------------------------------------ visite guidée */
const TOUR = [
  { title: "Voici l'outil : notre Monday.com", spot: "#hero",
    text: "Ceci est la page d'accueil d'Assistant Projet, l'outil de gestion de projet qu'on construit. Au lieu d'un tableau à lire, l'assistant vous dit ce qui demande une décision aujourd'hui, sur tous vos projets. Les projets « Site web » et « CRM » sont des exemples, pour la démonstration.",
    next: "Voir les cartes", act: () => { const c = document.querySelector('[id^="card-blocked"]'); c?.scrollIntoView({ block: "center", behavior: "smooth" }); } },
  { title: "Une carte = une décision, réglée sur place", spot: '[id^="card-blocked"]',
    text: "L'assistant a repéré une tâche bloquée, avec le dernier message de Sami. Chaque carte propose des actions directes. Cliquez sur « Je m'en occupe » : la tâche vous est assignée et passe En cours, sans quitter la page et sans attendre l'IA.",
    next: "Je m'en occupe", done: () => P("site").tasks.some((t) => t.name.startsWith("Configurer") && t.owner === ME),
    act: () => { const i = brief().find((x) => x.kind === "Bloqué"); if (i) quick("take", i.id); } },
  { title: "Avant / après, sans changer d'écran", spot: ".card.resolved",
    text: "La carte affiche « ✓ Réglé », avec « Annuler » pendant quelques secondes. Le point du jour s'est recalculé : en reprenant cette tâche, c'est vous qui portez maintenant 4 tâches, et l'outil le signale aussitôt dans « À surveiller ». Le lien « Ou demander à l'assistant » reste là quand vous voulez une analyse.",
    next: "Voir le projet", done: () => S.view === "site", act: () => go("site") },
  { title: "Le changement est enregistré dans le projet", spot: ".layout .group",
    text: "Dans le tableau du projet, la tâche du SSL est à votre nom, au statut En cours (ligne surlignée). Les responsables se choisissent dans la liste des membres de l'équipe. Prochaine étape : créer un projet à partir d'un simple texte.",
    next: "Voir une note de retard", done: () => S.view === "crm" && !!S.noteOpen,
    act: () => { S.noteOpen = P("crm").tasks.find((t) => t.name === "Exporter les contacts").id; go("crm"); $("#note-panel")?.scrollIntoView({ block: "center" }); } },
  { title: "Expliquer un retard, l'évaluer, le valider", spot: "#note-panel",
    text: "Sami, responsable de la tâche, a écrit sa note : type de problème, ce qui s'est passé, comment il l'a résolu, avec une évaluation de 3/5. Vous êtes chef de projet : vous seul pouvez cocher « Validé ». Essayez « Voir comme : Sami » en haut de la page : la case devient grisée.",
    next: "Valider la note de Sami", done: () => !!P("crm").tasks.find((t) => t.name === "Exporter les contacts").note.validated,
    act: () => { if (ME !== "Zaki") { ME = "Zaki"; $("#asuser").value = "Zaki"; } const t = P("crm").tasks.find((x) => x.name === "Exporter les contacts"); t.note.validated = true; t.note.validatedBy = "Zaki"; render(); toast("Note validée : elle comptera dans les leçons apprises."); } },
  { title: "Les leçons apprises", spot: "#lessons",
    text: "L'IA lit toutes les notes validées, pondérées par leur évaluation, et en tire des leçons par type de problème : ce qui a marché et ce qu'il faut faire dès le cadrage des prochains projets. Une leçon de faible poids est signalée comme « à confirmer ».",
    next: "Synthétiser avec l'IA", done: () => S.lessons.length > 0, act: () => { go("lessons"); synthesize(); } },
  { title: "Créer un projet en collant un texte", spot: ".intake-box, #loading",
    text: "On colle un brief, un courriel ou des notes. Utilisez l'exemple (un déménagement de bureaux), puis « Préparer le projet ». L'assistant en tire les dates, les livrables, l'équipe et un plan.",
    next: "Utiliser l'exemple et préparer", done: () => S.newStep === "review",
    act: () => { if (S.view !== "new") go("new"); if (S.newStep === "text") { S.intake = EXAMPLE; render(); prepare(); } } },
  { title: "Relire et corriger avant de créer", spot: "#plan",
    text: "Rien n'est encore enregistré. L'encadré jaune liste ce que l'assistant n'a pas pu deviner. Les tâches sans responsable sont en rouge : choisissez quelqu'un, changez une date ou supprimez une tâche. Puis créez le projet.",
    next: "Créer le projet", done: () => S.projects.some((p) => p.isNew), act: () => createFromDraft() },
  { title: "Le projet est créé et suivi", spot: "#nav",
    text: "Le nouveau projet apparaît dans la barre du haut et dans le point du jour. Ses dates sont figées comme plan de référence : si une tâche glisse, l'écart restera visible. C'est la fin de la visite. Explorez librement, ou recommencez la démo avec le lien en haut.",
    next: "Terminer la visite", act: () => { tourOpen = false; renderTour(); } },
];
let tourIdx = 0, tourOpen = true;
function renderTour() {
  document.querySelectorAll(".spot").forEach((x) => x.classList.remove("spot"));
  const box = $("#tour");
  if (!tourOpen) { box.innerHTML = `<button class="mini" id="tour-open">Visite guidée</button>`; return; }
  const s = TOUR[tourIdx];
  box.innerHTML = `<div class="gut"><div class="box" role="region" aria-label="Visite guidée">
    <div class="num">${tourIdx + 1}<small>/${TOUR.length}</small></div>
    <div><h4>${esc(s.title)}</h4><p>${esc(s.text)}</p></div>
    <div class="ctl"><button class="btn" id="tour-prev" ${tourIdx === 0 ? "disabled" : ""}>Précédent</button>
      <button class="btn demo" id="tour-next">${esc(s.next)}</button><button class="btn ghost" id="tour-close">Masquer</button></div></div></div>`;
  const target = s.spot && document.querySelector(s.spot);
  if (target) target.classList.add("spot");
}
function tourCheck() {
  const s = TOUR[tourIdx];
  if (tourOpen && s?.done && s.done() && tourIdx < TOUR.length - 1) { tourIdx++; renderTour(); }
  else renderTour();
}
$("#tour").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "tour-open") { tourOpen = true; renderTour(); return; }
  if (b.id === "tour-close") { tourOpen = false; renderTour(); return; }
  if (b.id === "tour-prev") { tourIdx = Math.max(0, tourIdx - 1); renderTour(); return; }
  if (b.id === "tour-next") {
    const s = TOUR[tourIdx];
    if (s.done && s.done()) { tourIdx = Math.min(TOUR.length - 1, tourIdx + 1); renderTour(); return; }
    s.act?.();
    if (!s.done) { if (tourIdx < TOUR.length - 1) tourIdx++; renderTour(); } else tourCheck();
  }
});

render();
})();
</script>
