const RAG = {"docs": [{"source": "rag-metier/glossaire.md", "title": "Glossaire", "tags": ["glossaire", "définition", "vocabulaire"], "sections": 7}, {"source": "rag-metier/methodes/gestion-des-retards.md", "title": "Gestion des retards", "tags": ["retard", "glissement", "blocage", "escalade", "dépendance", "fournisseur", "explication", "cause"], "sections": 6}, {"source": "rag-metier/methodes/lecons-apprises.md", "title": "Leçons apprises", "tags": ["leçons apprises", "retour d'expérience", "bilan", "amélioration", "registre", "sans reproche"], "sections": 4}, {"source": "rag-metier/methodes/planification.md", "title": "Planification d'un projet", "tags": ["plan", "tâches", "découpage", "estimation", "dépendances", "jalons", "marge", "chemin critique", "livrable"], "sections": 6}, {"source": "rag-metier/methodes/suivi-et-rapports.md", "title": "Suivi et rapports", "tags": ["suivi", "avancement", "rythme", "indicateur", "rapport", "point hebdomadaire", "état du projet", "vert orange rouge"], "sections": 4}, {"source": "rag-metier/pmo/roles-et-gouvernance.md", "title": "Rôles et gouvernance du PMO", "tags": ["PMO", "chef de projet", "responsable", "partie prenante", "comité", "validation", "rôle", "décision"], "sections": 5}], "extracts": [{"source": "rag-metier/glossaire.md", "title": "Glossaire", "tags": ["glossaire", "définition", "vocabulaire"], "heading": "Plan de référence", "text": "Les dates validées par le chef de projet au démarrage. Elles ne bougent plus : on compare les échéances actuelles à ces dates pour mesurer les glissements."}, {"source": "rag-metier/glossaire.md", "title": "Glossaire", "tags": ["glossaire", "définition", "vocabulaire"], "heading": "Glissement", "text": "Écart entre l'échéance actuelle d'une tâche et la date prévue dans le plan de référence."}, {"source": "rag-metier/glossaire.md", "title": "Glossaire", "tags": ["glossaire", "définition", "vocabulaire"], "heading": "Livrable", "text": "Résultat tangible remis à une partie prenante à une date donnée (site en ligne, données migrées, équipe formée)."}, {"source": "rag-metier/glossaire.md", "title": "Glossaire", "tags": ["glossaire", "définition", "vocabulaire"], "heading": "Jalon", "text": "Point de contrôle daté dans le projet, souvent lié à une validation ou à un livrable."}, {"source": "rag-metier/glossaire.md", "title": "Glossaire", "tags": ["glossaire", "définition", "vocabulaire"], "heading": "Chemin critique", "text": "Suite de tâches dépendantes la plus longue du projet : un retard sur l'une d'elles retarde la fin du projet."}, {"source": "rag-metier/glossaire.md", "title": "Glossaire", "tags": ["glossaire", "définition", "vocabulaire"], "heading": "Note d'explication", "text": "Texte écrit par le responsable d'une tâche en retard : type de problème, ce qui s'est passé, comment le résoudre. Évaluée de 1 à 5 et validée par le chef de projet."}, {"source": "rag-metier/glossaire.md", "title": "Glossaire", "tags": ["glossaire", "définition", "vocabulaire"], "heading": "Leçon apprise", "text": "Règle tirée de plusieurs notes d'explication validées, à appliquer dès le cadrage des projets suivants."}, {"source": "rag-metier/methodes/gestion-des-retards.md", "title": "Gestion des retards", "tags": ["retard", "glissement", "blocage", "escalade", "dépendance", "fournisseur", "explication", "cause"], "heading": "Détecter un retard tôt", "text": "Un retard se voit avant l'échéance. Signaux à surveiller : une tâche qui n'a pas commencé à 3 jours de son échéance, une tâche « En cours » sans mise à jour depuis plus d'une semaine, une tâche bloquée, une échéance repoussée par rapport au plan de référence. Plus le signal est repéré tôt, plus il reste d'options (réaffecter, découper, négocier le livrable)."}, {"source": "rag-metier/methodes/gestion-des-retards.md", "title": "Gestion des retards", "tags": ["retard", "glissement", "blocage", "escalade", "dépendance", "fournisseur", "explication", "cause"], "heading": "Demander une explication sans reproche", "text": "Quand une tâche est en retard, on demande au responsable trois choses : ce qui s'est passé (le problème), le type de cause, et une nouvelle date réaliste. Le ton vise la cause, jamais la personne : « Qu'est-ce qui a bloqué ? De quoi as-tu besoin ? ». Une demande perçue comme un reproche produit des excuses au lieu des vraies causes, et fausse l'apprentissage. Le chef de projet évalue ensuite la fiabilité de l'explication de 1 à 5 et la valide."}, {"source": "rag-metier/methodes/gestion-des-retards.md", "title": "Gestion des retards", "tags": ["retard", "glissement", "blocage", "escalade", "dépendance", "fournisseur", "explication", "cause"], "heading": "Types de causes de retard", "text": "- **Dépendance externe** : un client, un fournisseur ou une autre équipe ne livre pas à temps (validation, accès, matériel).\n- **Sous-estimation** : le travail était plus gros que prévu.\n- **Information manquante** : il manquait une donnée, une décision ou une spécification pour avancer.\n- **Changement de périmètre** : le besoin a changé en cours de route.\n- **Surcharge** : la personne était engagée sur trop de tâches ou de projets en même temps.\n- **Problème technique** : un outil, un système ou une limite technique a ralenti le travail."}, {"source": "rag-metier/methodes/gestion-des-retards.md", "title": "Gestion des retards", "tags": ["retard", "glissement", "blocage", "escalade", "dépendance", "fournisseur", "explication", "cause"], "heading": "Réagir à un blocage", "text": "Un blocage de plus de 2 jours ouvrables doit avoir un plan : qui débloque, avant quelle date. Au-delà de 3 jours, ou si un livrable est menacé, le chef de projet escalade au PMO. Options courantes : reprendre la tâche soi-même, la réaffecter, contourner la dépendance (solution provisoire), découper la tâche pour avancer sur la partie non bloquée, ou renégocier la date avec la partie prenante concernée."}, {"source": "rag-metier/methodes/gestion-des-retards.md", "title": "Gestion des retards", "tags": ["retard", "glissement", "blocage", "escalade", "dépendance", "fournisseur", "explication", "cause"], "heading": "Dépendances externes : prévention", "text": "Pour chaque tiers (client, fournisseur, autre équipe), convenir dès le cadrage d'un délai de réponse et d'un interlocuteur. Demander les accès et validations le plus tôt possible, idéalement dès la première semaine. Relancer à date fixe plutôt qu'à l'improviste, et prévoir une courte réunion de validation quand les échanges écrits traînent."}, {"source": "rag-metier/methodes/gestion-des-retards.md", "title": "Gestion des retards", "tags": ["retard", "glissement", "blocage", "escalade", "dépendance", "fournisseur", "explication", "cause"], "heading": "Replanifier après un retard", "text": "Avant d'accepter une nouvelle date, vérifier son effet sur les tâches qui en dépendent et sur les livrables. Le plan de référence n'est pas modifié : l'écart reste visible pour l'apprentissage. Si plusieurs tâches d'un même type glissent, revoir l'estimation des tâches semblables restantes plutôt que de corriger au cas par cas."}, {"source": "rag-metier/methodes/lecons-apprises.md", "title": "Leçons apprises", "tags": ["leçons apprises", "retour d'expérience", "bilan", "amélioration", "registre", "sans reproche"], "heading": "Pourquoi un registre des leçons apprises", "text": "Les mêmes causes de retard reviennent d'un projet à l'autre (validations client lentes, accès tardifs, estimations optimistes). Un registre transforme chaque retard expliqué en règle pour les projets suivants. Il n'est utile que s'il est consulté au moment du cadrage d'un nouveau projet."}, {"source": "rag-metier/methodes/lecons-apprises.md", "title": "Leçons apprises", "tags": ["leçons apprises", "retour d'expérience", "bilan", "amélioration", "registre", "sans reproche"], "heading": "Qu'est-ce qu'une bonne leçon", "text": "Une bonne leçon décrit un problème type (et non un incident isolé), ce qui a permis de le résoudre, et une action concrète à faire dès le cadrage. Exemple : « Les validations client prennent souvent plus de 3 jours : fixer un délai de réponse au cadrage et prévoir une réunion de validation de 30 minutes. »"}, {"source": "rag-metier/methodes/lecons-apprises.md", "title": "Leçons apprises", "tags": ["leçons apprises", "retour d'expérience", "bilan", "amélioration", "registre", "sans reproche"], "heading": "Revue sans reproche", "text": "Les leçons s'appuient sur des explications sincères. La revue porte sur le processus et les causes, jamais sur les personnes : pas de classement, pas de score individuel. Une explication jugée peu fiable reçoit une évaluation basse et pèse peu, sans sanction."}, {"source": "rag-metier/methodes/lecons-apprises.md", "title": "Leçons apprises", "tags": ["leçons apprises", "retour d'expérience", "bilan", "amélioration", "registre", "sans reproche"], "heading": "Poids d'une leçon", "text": "Une leçon confirmée par plusieurs retards bien expliqués (évaluations 4 ou 5) est solide. Une leçon qui repose sur une seule explication peu fiable est « à confirmer » : on la garde, mais on ne change pas les pratiques sur cette seule base."}, {"source": "rag-metier/methodes/planification.md", "title": "Planification d'un projet", "tags": ["plan", "tâches", "découpage", "estimation", "dépendances", "jalons", "marge", "chemin critique", "livrable"], "heading": "Partir des livrables", "text": "Un plan se construit à partir des livrables, pas d'une liste d'activités. Pour chaque livrable : qui le valide, à quelle date, et quelles tâches sont nécessaires pour le produire. Une tâche qui ne contribue à aucun livrable doit être questionnée."}, {"source": "rag-metier/methodes/planification.md", "title": "Planification d'un projet", "tags": ["plan", "tâches", "découpage", "estimation", "dépendances", "jalons", "marge", "chemin critique", "livrable"], "heading": "Découper le travail", "text": "Une bonne tâche a un responsable unique, un résultat vérifiable et une durée de 1 à 10 jours ouvrables. Au-delà de 10 jours, la découper : une grosse tâche cache ses retards jusqu'à la fin. Nommer les tâches par un verbe et un résultat (« Valider la maquette », pas « Maquette »)."}, {"source": "rag-metier/methodes/planification.md", "title": "Planification d'un projet", "tags": ["plan", "tâches", "découpage", "estimation", "dépendances", "jalons", "marge", "chemin critique", "livrable"], "heading": "Estimer avec trois valeurs", "text": "Pour une tâche incertaine, demander trois estimations : optimiste (O), probable (P) et pessimiste (Pe). Estimation retenue : (O + 4 × P + Pe) / 6. L'écart entre optimiste et pessimiste mesure l'incertitude : plus il est grand, plus il faut de marge ou de découpage."}, {"source": "rag-metier/methodes/planification.md", "title": "Planification d'un projet", "tags": ["plan", "tâches", "découpage", "estimation", "dépendances", "jalons", "marge", "chemin critique", "livrable"], "heading": "Dépendances et chemin critique", "text": "Identifier les tâches qui en conditionnent d'autres (accès, validations, données). La suite de tâches dépendantes la plus longue est le chemin critique : tout retard sur ces tâches retarde le projet entier. Les placer en premier, en priorité haute, et les suivre de près."}, {"source": "rag-metier/methodes/planification.md", "title": "Planification d'un projet", "tags": ["plan", "tâches", "découpage", "estimation", "dépendances", "jalons", "marge", "chemin critique", "livrable"], "heading": "Marges et plan de référence", "text": "Prévoir une marge sur les tâches risquées (dépendances externes, première fois, volume inconnu) plutôt que d'allonger toutes les tâches. Une fois le plan validé par le chef de projet, ses dates deviennent le plan de référence : on mesure ensuite les glissements par rapport à lui."}, {"source": "rag-metier/methodes/planification.md", "title": "Planification d'un projet", "tags": ["plan", "tâches", "découpage", "estimation", "dépendances", "jalons", "marge", "chemin critique", "livrable"], "heading": "Répartir la charge", "text": "Avant d'assigner, vérifier la charge de chaque personne sur tous ses projets, pas seulement sur le projet en cours. Éviter plus de 3 tâches ouvertes en parallèle par personne. Une personne surchargée est une cause fréquente de retards en chaîne."}, {"source": "rag-metier/methodes/suivi-et-rapports.md", "title": "Suivi et rapports", "tags": ["suivi", "avancement", "rythme", "indicateur", "rapport", "point hebdomadaire", "état du projet", "vert orange rouge"], "heading": "Avancement réel et rythme attendu", "text": "L'avancement réel est la part des tâches terminées. Le rythme attendu est la part du temps écoulé entre le début et la fin du projet. Si l'avancement est inférieur à 80 % du rythme attendu, le projet est « à surveiller » ; s'il y a un blocage ou un retard non traité, il est « en retard »."}, {"source": "rag-metier/methodes/suivi-et-rapports.md", "title": "Suivi et rapports", "tags": ["suivi", "avancement", "rythme", "indicateur", "rapport", "point hebdomadaire", "état du projet", "vert orange rouge"], "heading": "État d'un projet : vert, orange, rouge", "text": "- **Vert (dans les temps)** : pas de blocage, avancement conforme au rythme, livrables tenables.\n- **Orange (à surveiller)** : glissements ou avancement en dessous du rythme, mais les livrables restent tenables avec des actions.\n- **Rouge (en retard)** : blocage, retard sur le chemin critique, ou livrable menacé. Demande une décision du PMO."}, {"source": "rag-metier/methodes/suivi-et-rapports.md", "title": "Suivi et rapports", "tags": ["suivi", "avancement", "rythme", "indicateur", "rapport", "point hebdomadaire", "état du projet", "vert orange rouge"], "heading": "Point hebdomadaire", "text": "Un point hebdomadaire court (15 minutes) répond à quatre questions : qu'est-ce qui est terminé, qu'est-ce qui a glissé et pourquoi, qu'est-ce qui bloque et qui débloque, quelle décision faut-il prendre. On ne relit pas toutes les tâches : on traite les écarts."}, {"source": "rag-metier/methodes/suivi-et-rapports.md", "title": "Suivi et rapports", "tags": ["suivi", "avancement", "rythme", "indicateur", "rapport", "point hebdomadaire", "état du projet", "vert orange rouge"], "heading": "Rapport au comité ou au client", "text": "Un rapport tient sur une page : état global (vert, orange, rouge), livrables et dates, faits marquants, risques et décisions attendues. Les chiffres sont accompagnés d'une phrase d'explication. Un rapport qui ne demande aucune décision peut souvent être remplacé par un message court."}, {"source": "rag-metier/pmo/roles-et-gouvernance.md", "title": "Rôles et gouvernance du PMO", "tags": ["PMO", "chef de projet", "responsable", "partie prenante", "comité", "validation", "rôle", "décision"], "heading": "Le PMO", "text": "Le bureau de projets (PMO) suit le portefeuille : il voit l'état de tous les projets, arbitre les priorités et la charge entre projets, tient le registre des leçons apprises et fixe les règles communes (plan de référence, escalade, rapports)."}, {"source": "rag-metier/pmo/roles-et-gouvernance.md", "title": "Rôles et gouvernance du PMO", "tags": ["PMO", "chef de projet", "responsable", "partie prenante", "comité", "validation", "rôle", "décision"], "heading": "Le chef de projet", "text": "Le chef de projet est responsable du plan et de son suivi. Il valide le plan de référence, évalue et valide les explications de retard, décide des replanifications et escalade au PMO ce qui dépasse son autorité (budget, priorité entre projets, livrable menacé)."}, {"source": "rag-metier/pmo/roles-et-gouvernance.md", "title": "Rôles et gouvernance du PMO", "tags": ["PMO", "chef de projet", "responsable", "partie prenante", "comité", "validation", "rôle", "décision"], "heading": "Le responsable d'une tâche", "text": "Chaque tâche a un seul responsable. Il tient le statut à jour, signale un blocage dès qu'il apparaît et, en cas de retard, écrit la note d'explication : type de problème, ce qui s'     const loading = S.newStep === "loading";
    return `<section class="hero intake-h" data-vue="new-${S.newStep}"><div class="date">Nouveau projet</div><h1>Racontez-moi le projet.</h1>
      <p class="headline">Collez un brief, un courriel ou vos notes. L'assistant prépare le contexte, l'équipe et un plan complet, que vous relirez avant de créer le projet.</p>
      ${loading ? `<div class="loading" id="loading" style="margin-top:16px" aria-busy="true"><div class="on">${ICO.arrow}Je lis le texte…</div><div>${ICO.arrow}Je repère les dates, les livrables et l'équipe…</div><div>${ICO.arrow}Je découpe le travail en phases et en tâches…</div></div>` :
      `<div class="intake-box" style="margin-top:16px"><textarea id="intake" rows="10" placeholder="Objectif, dates, livrables, qui fait quoi, contraintes… Écrivez comme à un collègue." aria-label="Description du projet">${esc(S.intake)}</textarea>
        <div class="intake-actions"><button class="btn ghost" id="useex">Utiliser l'exemple (déménagement de bureaux)</button><span style="flex:1"></span>
        <button class="go" id="prepare" ${S.intake.trim().length < 20 ? "disabled" : ""}>Préparer le projet</button></div></div>`}
      <button class="ghostlink" data-go="today" style="margin-top:12px">${ICO.back}Retour à Aujourd'hui</button></section>`;
  }
  const d = S.draft;
  const n = d.groups.reduce((k, [, ts]) => k + ts.length, 0);
  const un = d.groups.reduce((k, [, ts]) => k + ts.filter((t) => !t[1]).length, 0);
  return `<div class="review-head" data-vue="new-review"><div><div class="muted">Relisez et corrigez : rien n'est enregistré avant votre validation.</div>
      <input class="title-input" id="dname" value="${esc(d.name)}" aria-label="Nom du projet"></div>
      <div class="review-cta"><button class="btn" id="restartnew">Recommencer</button><button class="btn primary" id="create" style="padding:10px 16px">Créer le projet et figer le plan (${n} tâches)</button></div></div>
    <aside class="questions" id="questions"><strong>À préciser</strong> <span class="muted">· ce que l'assistant n'a pas pu déduire du texte</span><ul>${d.questions.map((q) => `<li>${esc(q)}</li>`).join("")}</ul></aside>
    <div class="review-grid"><section class="panel"><h2>Contexte</h2><p style="margin:0">${esc(d.description)}</p>
      <p class="muted mono">Du ${fmt(d.start)} au ${fmt(d.end)}</p>
      <h4>Livrables</h4><ul class="plain">${d.deliverables.map(([x, y]) => `<li><span>${esc(x)}</span><span class="mono">${fmt(y)}</span></li>`).join("")}</ul>
      ${d.stakeholders.length ? `<h4>Parties prenantes</h4><ul class="plain">${d.stakeholders.map(([x, y]) => `<li><span>${esc(x)}</span><span class="muted">${esc(y)}</span></li>`).join("")}</ul>` : ""}
      <h4>Équipe</h4><ul class="plain">${d.team.map(([x, y]) => `<li><span>${esc(x)}</span><span class="muted">${esc(y)}</span></li>`).join("")}</ul></section>
    <section class="panel plan" id="plan"><h2>Plan <span class="muted">${n} tâches${un ? ` · ${un} sans responsable` : ""}</span></h2>
      ${d.groups.map(([g, ts], gi) => `<div class="pgroup"><h3>${esc(g)}</h3><div class="tscroll"><table><tbody>
        ${ts.map(([name, owner, due, prio], ti) => `<tr><td><input class="cell" id="tn-${gi}-${ti}" value="${esc(name)}" data-g="${gi}" data-t="${ti}" data-f="0" aria-label="Tâche"></td>
          <td style="width:150px"><select class="cell" id="to-${gi}-${ti}" data-g="${gi}" data-t="${ti}" data-f="1" data-empty="${!owner}" aria-label="Responsable"><option value="">— à assigner</option>${d.team.map(([m]) => `<option ${m === owner ? "selected" : ""}>${esc(m)}</option>`).join("")}</select></td>
          <td style="width:160px"><input class="cell mono" id="td-${gi}-${ti}" type="date" value="${due}" data-g="${gi}" data-t="${ti}" data-f="2" aria-label="Échéance"></td>
          <td style="width:40px"><button class="x" data-del="${gi}-${ti}" aria-label="Retirer la tâche">${ICO.x}</button></td></tr>`).join("")}
        </tbody></table></div><button class="add" data-addt="${gi}">${ICO.plus}Tâche</button></div>`).join("")}
    </section></div>`;
}

function render() {
  const avant = window.Poste ? window.Poste.avant() : null;
  renderNav();
  const m = $("#main");
  m.innerHTML = S.view === "today" ? renderToday() : S.view === "new" ? renderNew() : S.view === "lessons" ? renderLessons() : S.view === "parametres" ? renderSettings() : renderProject(P(S.view));
  const log = $("#log"); if (log) log.scrollTop = 1e6;
  if (S.flash) { const row = $("#row-" + S.flash); if (row) row.scrollIntoView({ block: "center", behavior: "smooth" }); S.flash = null; }
  renderTour();
  if (window.Poste) window.Poste.apres(avant);
}

/* ------------------------------------------------------------ événements */
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.go) return go(b.dataset.go);
  if (b.dataset.act) {
    if (b.dataset.item) S.handled.push(b.dataset.item);
    if (S.view !== b.dataset.pid) S.view = b.dataset.pid;
    window.scrollTo({ top: 0 });
    runAction(b.dataset.act, b.dataset.arg, b.dataset.pid); render(); tourCheck(); return;
  }
  if (b.dataset.q) { quick(b.dataset.q, b.dataset.item); return; }
  if (b.dataset.note) { S.noteOpen = S.noteOpen === b.dataset.note ? null : b.dataset.note; render(); $("#note-panel")?.scrollIntoView({ block: "nearest", behavior: "smooth" }); return; }
  if (b.dataset.rate) {
    const [p, t] = findTaskById(b.dataset.rate); if (!canEditNote(p, t)) return;
    const n = +b.dataset.n; S.needRate = null; if (t.note.rating === n) return;
    const was = t.note.validated; Object.assign(t.note, { rating: n, ratedBy: ME, validated: false, validatedBy: null }); render();
    toast(was ? `Évaluée ${n}/5. La validation a été décochée : le chef de projet doit revalider.` : `Évaluée ${n}/5.`); return;
  }
  if (b.dataset.savenote) {
    const [p, t] = findTaskById(b.dataset.savenote); if (!canEditNote(p, t)) return;
    const type = $("#nt").value, problem = $("#np").value.trim(), resolution = $("#nr").value.trim();
    // Erreurs affichées dans le panneau, sans effacer ce qui a été tapé.
    const err = (text) => { const e = $("#note-err"); if (e) e.textContent = text; $("#np")?.focus(); };
    if (problem.length < 5) { err("Décrivez le problème en quelques mots (5 caractères minimum) dans « Problème : que s'est-il passé ? »."); return; }
    const was = t.note?.validated, isNew = !t.note, changed = isNew || t.note.type !== type || t.note.problem !== problem || t.note.resolution !== resolution;
    if (!changed) { err("Aucun changement à enregistrer."); return; }
    S.noteError = null;
    t.note = { ...(t.note || { rating: null, ratedBy: null }), type, problem, resolution, author: ME, validated: false, validatedBy: null };
    S.flash = t.id; render(); toast(was ? "Note enregistrée. La validation a été décochée : le chef de projet doit revalider." : isNew ? "Note ajoutée. Étape suivante : évaluez-la de 1 à 5 avec les étoiles." : "Note enregistrée."); return;
  }
  if (b.id === "synth") { synthesize(); return; }
  if (b.id === "save-settings") { saveSettings(); return; }
  if (b.dataset.tab) { S.tab = b.dataset.tab; S.phits = null; render(); return; }
  if (b.id === "doc-open") { S.addDoc = true; render(); $("#doc-name")?.focus(); return; }
  if (b.id === "doc-cancel") { S.addDoc = false; render(); return; }
  if (b.id === "doc-add") {
    const p = P(S.view), name = $("#doc-name").value.trim(), content = $("#doc-content").value.trim();
    if (!name || content.length < 20) { $("#doc-err").textContent = !name ? "Donnez un nom au document." : "Le document est vide ou trop court."; return; }
    let file = slug(name) + ".md"; for (let i = 2; p.docs.some((d) => d.file === file); i++) file = `${slug(name)}-${i}.md`;
    p.docs.push({ file, text: `# ${name}\n\n${content}` }); S.addDoc = false; render();
    toast(`Document ajouté : rag-client/${p.dir}/${file}. L'assistant du projet peut maintenant s'en servir.`); return;
  }
  if (b.id === "pdoc-go") { S.pq = $("#pdoc-q").value.trim(); S.phits = S.pq ? searchProject(P(S.view), S.pq) : null; render(); return; }
  if (b.id === "k-go") { S.kq = $("#k-q").value.trim(); S.khits = S.kq ? searchRag(S.kq) : null; render(); return; }
  if (b.id === "test-conn") { testConnection(); return; }
  if (b.id === "del-key") { S.settings.keyLast4 = null; S.settings.msg = { ok: true, text: "Clé supprimée." }; S.settings.test = null; render(); return; }
  if (b.dataset.undo) { const r = S.resolved[b.dataset.undo]; if (r?.undo) { r.undo(); delete S.resolved[b.dataset.undo]; render(); toast("Annulé."); } return; }
  if (b.dataset.later) { S.handled.push(b.dataset.later); render(); toast("Masqué jusqu'à demain."); return; }
  if (b.id === "unhide") { S.handled = []; render(); return; }
  if (b.dataset.cycle) { for (const p of S.projects) { const t = p.tasks.find((x) => x.id === b.dataset.cycle); if (t) { t.status = NEXT[t.status]; S.flash = null; } } render(); return; }
  if (b.dataset.say) { freeText(S.view, b.dataset.say); return; }
  if (b.id === "useex") { S.intake = EXAMPLE; render(); tourCheck(); return; }
  if (b.id === "prepare") return prepare();
  if (b.id === "restartnew") { S.newStep = "text"; S.draft = null; render(); return; }
  if (b.id === "create") return createFromDraft();
  if (b.dataset.del) { const [g, t] = b.dataset.del.split("-").map(Number); S.draft.groups[g][1].splice(t, 1); render(); return; }
  if (b.dataset.addt) { S.draft.groups[+b.dataset.addt][1].push(["Nouvelle tâche", null, S.draft.end, "Moyenne"]); render(); return; }
  if (b.id === "restart") { S = seed(); ME = "Zaki"; $("#asuser").value = "Zaki"; tourIdx = 0; tourOpen = true; render(); return; }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "intake") { S.intake = e.target.value; const p = $("#prepare"); if (p) p.disabled = S.intake.trim().length < 20; }
  if (e.target.id === "dname") S.draft.name = e.target.value;
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.id === "asuser") { ME = el.value; render(); toast(`Vous voyez l'outil comme ${ME}.`); return; }
  if (el.dataset.validate) {
    const [p, t] = findTaskById(el.dataset.validate);
    if (!isPM(p, ME)) { el.checked = !el.checked; toast("Seul le chef de projet peut valider."); return; }
    if (el.checked && !t.note.rating) {
      el.checked = false; S.needRate = t.id; S.noteOpen = t.id; render();
      $("#note-panel")?.scrollIntoView({ block: "nearest", behavior: "smooth" });
      toast("Donnez d'abord une évaluation de 1 à 5 avec les étoiles, puis cochez « Validé »."); return;
    }
    S.needRate = null;
    t.note.validated = el.checked; t.note.validatedBy = el.checked ? ME : null; render(); tourCheck();
    toast(el.checked ? "Note validée : elle comptera dans les leçons apprises." : "Validation retirée."); return;
  }
  if (el.dataset.due) { S.dates[el.dataset.due] = el.value; return; }
  if (el.dataset.reassign) { quick("reassign", el.dataset.item, { task: el.dataset.reassign, owner: el.value }); return; }
  if (el.dataset.owner) {
    const t = P(S.view).tasks.find((x) => x.id === el.dataset.owner);
    t.owner = el.value || null; S.flash = t.id; render();
    toast(t.owner ? `« ${t.name} » est confiée à ${t.owner}.` : `« ${t.name} » n'a plus de responsable.`);
    return;
  }
  if (el.dataset.f === undefined || !S.draft) return;
  const row = S.draft.groups[+el.dataset.g][1][+el.dataset.t];
  row[+el.dataset.f] = el.value || null; render();
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.id === "chatform") { const v = $("#chatq").value.trim(); if (v) freeText(S.view, v); }
  if (e.target.id === "askform") { const v = $("#askq").value.trim(); if (v) { const pid = $("#askp").value; S.view = pid; freeText(pid, v); } }
});
function prepare() {
  S.newStep = "loading"; render();
  const lines = () => [...document.querySelectorAll("#loading div")];
  setTimeout(() => lines()[1]?.classList.add("on"), 500);
  setTimeout(() => lines()[2]?.classList.add("on"), 1000);
  setTimeout(() => { S.draft = S.intake.trim() === EXAMPLE.trim() ? exampleDraft() : genericDraft(S.intake); S.newStep = "review"; render(); tourCheck(); }, 1600);
}
let tt; function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => (t.hidden = true), 2800); }

/* ------------------------------------------------------------ visite guidée */
const TOUR = [
  { title: "Voici l'outil", spot: "#hero",
    text: "La page d'accueil d'Assistant Projet. Au lieu d'un tableau à lire, l'assistant dit ce qui demande une décision aujourd'hui, sur tous vos projets. « Site web » et « CRM » sont des projets d'exemple.",
    next: "Voir les cartes", act: () => { const c = document.querySelector('[id^="card-blocked"]'); c?.scrollIntoView({ block: "center", behavior: "smooth" }); } },
  { title: "Une carte = une décision, réglée sur place", spot: '[id^="card-blocked"]',
    text: "L'assistant a repéré une tâche bloquée, avec le dernier message de Sami. Chaque carte propose des actions directes. Cliquez sur « Je m'en occupe » : la tâche vous est assignée et passe En cours, sans quitter la page et sans attendre l'IA.",
    next: "Je m'en occupe", done: () => P("site").tasks.some((t) => t.name.startsWith("Configurer") && t.owner === ME),
    act: () => { const i = brief().find((x) => x.kind === "Bloqué"); if (i) quick("take", i.id); } },
  { title: "Avant / après, sans changer d'écran", spot: ".card.resolved",
    text: "La carte affiche « ✓ Réglé », avec « Annuler » pendant quelques secondes. Le point du jour s'est recalculé : en reprenant cette tâche, c'est vous qui portez maintenant 4 tâches, et l'outil le signale aussitôt dans « À surveiller ». Le lien « Ou demander à l'assistant » reste là quand vous voulez une analyse.",
    next: "Voir le projet", done: () => S.view === "site", act: () => go("site") },
  { title: "Le changement est enregistré dans le projet", spot: ".layout .group",
    text: "Dans le tableau du projet, la tâche du SSL est à votre nom, au statut En cours (ligne surlignée). Les responsables se choisissent dans la liste des membres de l'équipe. Prochaine étape : créer un projet à partir d'un simple texte.",
    next: "Voir une note de retard", done: () => S.view === "crm" && !!S.noteOpen,
    act: () => { S.noteOpen = P("crm").tasks.find((t) => t.name === "Exporter les contacts").id; go("crm"); $("#note-panel")?.scrollIntoView({ block: "center" }); } },
  { title: "Expliquer un retard, l'évaluer, le valider", spot: "#note-panel",
    text: "Sami, responsable de la tâche, a écrit sa note : type de problème, ce qui s'est passé, comment il l'a résolu, avec une évaluation de 3/5. Vous êtes chef de projet : vous seul pouvez cocher « Validé ». Essayez « Voir comme : Sami » en haut de la page : la case devient grisée.",
    next: "Valider la note de Sami", done: () => !!P("crm").tasks.find((t) => t.name === "Exporter les contacts").note.validated,
    act: () => { if (ME !== "Zaki") { ME = "Zaki"; $("#asuser").value = "Zaki"; } const t = P("crm").tasks.find((x) => x.name === "Exporter les contacts"); t.note.validated = true; t.note.validatedBy = "Zaki"; render(); toast("Note validée : elle comptera dans les leçons apprises."); } },
  { title: "Les leçons apprises", spot: "#lessons",
    text: "L'IA lit toutes les notes validées, pondérées par leur évaluation, et en tire des leçons par type de problème : ce qui a marché et ce qu'il faut faire dès le cadrage des prochains projets. Une leçon de faible poids est signalée comme « à confirmer ».",
    next: "Synthétiser avec l'IA", done: () => S.lessons.length > 0, act: () => { go("lessons"); synthesize(); } },
  { title: "Créer un projet en collant un texte", spot: ".intake-box, #loading",
    text: "On colle un brief, un courriel ou des notes. Utilisez l'exemple (un déménagement de bureaux), puis « Préparer le projet ». L'assistant en tire les dates, les livrables, l'équipe et un plan.",
    next: "Utiliser l'exemple et préparer", done: () => S.newStep === "review",
    act: () => { if (S.view !== "new") go("new"); if (S.newStep === "text") { S.intake = EXAMPLE; render(); prepare(); } } },
  { title: "Relire et corriger avant de créer", spot: "#plan",
    text: "Rien n'est encore enregistré. L'encadré jaune liste ce que l'assistant n'a pas pu deviner. Les tâches sans responsable sont en rouge : choisissez quelqu'un, changez une date ou supprimez une tâche. Puis créez le projet.",
    next: "Créer le projet", done: () => S.projects.some((p) => p.isNew), act: () => createFromDraft() },
  { title: "Le projet est créé et suivi", spot: "#nav",
    text: "Le nouveau projet apparaît dans la barre du haut et dans le point du jour. Ses dates sont figées comme plan de référence : si une tâche glisse, l'écart restera visible. C'est la fin de la visite. Explorez librement, ou recommencez la démo avec le lien en haut.",
    next: "Terminer la visite", act: () => { tourOpen = false; renderTour(); } },
];
let tourIdx = 0, tourOpen = true;
function renderTour() {
  document.querySelectorAll(".spot").forEach((x) => x.classList.remove("spot"));
  const box = $("#tour");
  if (!tourOpen) { box.innerHTML = `<button class="mini" id="tour-open">${ICO.chev}Visite guidée</button>`; if (window.Poste) window.Poste.tour(); return; }
  const s = TOUR[tourIdx];
  const ouvert = !!(window.Poste && window.Poste.tourOuvert);
  box.innerHTML = `<div class="gut"><div class="box" role="region" aria-label="Visite guidée" ${ouvert ? "data-ouvert" : ""}>
    <span class="num"><span class="num-l">Visite </span><span class="mono"><b>${tourIdx + 1}</b>/${TOUR.length}</span></span>
    <button class="tour-title" type="button" data-tour-plie aria-expanded="${ouvert}" aria-controls="tour-more"><span>${esc(s.title)}</span>${ICO.chev}</button>
    <button class="btn demo" id="tour-next">${esc(s.next)}</button>
    <button class="btn close" id="tour-close" aria-label="Masquer la visite guidée">${ICO.x}</button>
    <div class="tour-more" id="tour-more"><p>${esc(s.text)}</p><div class="ctl"><button class="btn" id="tour-prev" ${tourIdx === 0 ? "disabled" : ""}>Précédent</button></div></div></div></div>`;
  const target = s.spot && document.querySelector(s.spot);
  if (target) target.classList.add("spot");
  reserveTourSpace();
  if (window.Poste) window.Poste.tour();
}
/** Réserve en bas de page la hauteur réelle de la visite guidée, pour qu'elle ne recouvre jamais un bouton. */
function reserveTourSpace() {
  const h = $("#tour").getBoundingClientRect().height;
  document.body.style.paddingBottom = `calc(${Math.ceil(h) + 24}px + env(safe-area-inset-bottom, 0px))`;
}
window.addEventListener("resize", reserveTourSpace);
function tourCheck() {
  const s = TOUR[tourIdx];
  if (tourOpen && s?.done && s.done() && tourIdx < TOUR.length - 1) { tourIdx++; renderTour(); }
  else renderTour();
}
$("#tour").addEventListener("click", (e) => {
  if (e.target.matches(".tour p")) { e.target.classList.toggle("full"); reserveTourSpace(); return; }
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "tour-open") { tourOpen = true; renderTour(); return; }
  if (b.id === "tour-close") { tourOpen = false; renderTour(); return; }
  if (b.id === "tour-prev") { tourIdx = Math.max(0, tourIdx - 1); renderTour(); return; }
  if (b.id === "tour-next") {
    const s = TOUR[tourIdx];
    if (s.done && s.done()) { tourIdx = Math.min(TOUR.length - 1, tourIdx + 1); renderTour(); return; }
    s.act?.();
    if (!s.done) { if (tourIdx < TOUR.length - 1) tourIdx++; renderTour(); } else tourCheck();
  }
});

render();
})();
</script>
</body>
</html>
